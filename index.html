        </tr>`;
      }).join("")}</tbody>
    </table></div>
  </div>`;
}

/* ============================================================================
   PAGE: EXPLORER
   ========================================================================== */
function filterPanel(counts) {
  const f = State.ui.filters;
  const cb = (arr, val, label, count) => `<label><input type="checkbox" data-fk="${arr}" value="${esc(val)}" ${f[arr].includes(val) ? "checked" : ""}/> <span>${esc(label)}</span>${count != null ? `<span class="c">${count}</span>` : ""}</label>`;
  const grp = (title, body, open) => `<div class="fgroup ${open ? "" : "closed"}"><h5>${title}${ic("i-chev", "cv")}</h5><div class="fbody">${body}</div></div>`;

  const countryOpts = countBy(State.opportunities, o => o.country).slice(0, 40);
  const areaOpts = countBy(State.opportunities, o => o.researchArea).slice(0, 30);
  const agencyOpts = countBy(State.opportunities, o => o.fundingAgency).slice(0, 25);

  return `<div class="card" style="position:sticky;top:76px">
    <div class="card-h"><h3>Filters</h3><div class="right"><button class="btn btn-xs" id="clearFilters">Clear all</button></div></div>
    <div class="card-b tight filters" style="max-height:calc(100vh - 170px);overflow-y:auto">
      ${grp("Status", `<div class="checklist">${["Open","Closing Soon","Closed"].map(s => cb("status", s, s, State.opportunities.filter(o => o.status === s).length)).join("")}</div>`, true)}
      ${grp("Country", `<div class="checklist" style="max-height:190px;overflow-y:auto">${countryOpts.map(c => cb("countries", c.k, c.k, c.v)).join("")}</div>`, true)}
      ${grp("Research area", `<div class="checklist" style="max-height:190px;overflow-y:auto">${areaOpts.map(c => cb("areas", c.k, c.k, c.v)).join("")}</div>`, true)}
      ${grp("Funding type", `<div class="checklist">${FUNDING_TYPES.map(c => cb("funding", c, c, State.opportunities.filter(o => o.fundingType === c).length)).join("")}</div>`)}
      ${grp("Funding agency", `<div class="checklist" style="max-height:170px;overflow-y:auto">${agencyOpts.map(c => cb("agencies", c.k, c.k, c.v)).join("")}</div>`)}
      ${grp("Required software", `<div class="checklist" style="max-height:170px;overflow-y:auto">${SOFTWARE.map(c => cb("software", c, c, State.opportunities.filter(o => (o.requiredSoftware || []).includes(c)).length)).join("")}</div>`)}
      ${grp("Programming", `<div class="checklist">${LANGS.map(c => cb("langs", c, c, State.opportunities.filter(o => (o.requiredLanguages || []).includes(c)).length)).join("")}</div>`)}
      ${grp("Work mode", `<div class="checklist">${["On-site","Hybrid","Remote"].map(c => cb("remote", c, c, State.opportunities.filter(o => o.workMode === c).length)).join("")}</div>`)}
      ${grp("Support & benefits", `<div class="checklist">
        <label><input type="checkbox" data-fb="visa" ${f.visa ? "checked" : ""}/> <span>Visa sponsorship</span></label>
        <label><input type="checkbox" data-fb="flight" ${f.flight ? "checked" : ""}/> <span>Flight ticket</span></label>
        <label><input type="checkbox" data-fb="accommodation" ${f.accommodation ? "checked" : ""}/> <span>Accommodation</span></label>
        <label><input type="checkbox" data-fb="insurance" ${f.insurance ? "checked" : ""}/> <span>Medical insurance</span></label>
        <label><input type="checkbox" data-fb="family" ${f.family ? "checked" : ""}/> <span>Family support</span></label>
      </div>`, true)}
      ${grp("Thresholds", `
        <div class="field"><label class="fl">Minimum stipend ≈ USD/mo <b class="mono" id="lblStipend">${num(f.minStipendUSD)}</b></label>
          <input type="range" min="0" max="9000" step="100" value="${f.minStipendUSD}" data-fr="minStipendUSD"/></div>
        <div class="field"><label class="fl">Best university rank (≤) <b class="mono" id="lblRank">${f.maxRank || "any"}</b></label>
          <input type="range" min="0" max="1000" step="25" value="${f.maxRank}" data-fr="maxRank"/></div>
        <div class="field"><label class="fl">Minimum match % <b class="mono" id="lblMatch">${f.minMatch}</b></label>
          <input type="range" min="0" max="100" step="5" value="${f.minMatch}" data-fr="minMatch"/></div>
        <div class="field"><label class="fl">Deadline within (days) <b class="mono" id="lblDl">${f.deadlineWithin || "any"}</b></label>
          <input type="range" min="0" max="365" step="15" value="${f.deadlineWithin}" data-fr="deadlineWithin"/></div>
        <div class="field"><label class="fl">Minimum duration (months) <b class="mono" id="lblDur">${f.minDuration || "any"}</b></label>
          <input type="range" min="0" max="48" step="6" value="${f.minDuration}" data-fr="minDuration"/></div>`, true)}
      ${grp("Data quality", `<div class="checklist">
        <label><input type="checkbox" data-fb="hideSynthetic" ${f.hideSynthetic ? "checked" : ""}/> <span>Hide synthetic records</span></label>
        <label><input type="checkbox" data-fb="syntheticOnly" ${f.syntheticOnly ? "checked" : ""}/> <span>Show only synthetic</span></label>
      </div>`, true)}
    </div>
  </div>`;
}

function pageExplore(preset, heading, sub) {
  let L = withComputed(State.opportunities);
  if (preset) L = L.filter(preset);
  const filtered = sortList(applyFilters(L));
  const ps = State.ui.pageSize;
  const pages = Math.max(1, Math.ceil(filtered.length / ps));
  const page = clamp(State.ui.page, 1, pages);
  const slice = filtered.slice((page - 1) * ps, page * ps);
  const activeChips = [];
  const f = State.ui.filters;
  ["countries","areas","funding","agencies","software","langs","remote","status"].forEach(k => {
    f[k].forEach(v => activeChips.push({ k, v }));
  });
  ["visa","flight","accommodation","insurance","family","hideSynthetic","syntheticOnly"].forEach(k => { if (f[k]) activeChips.push({ k, v: true, bool: true }); });

  return `
  <div class="hdr">
    <div><h1>${esc(heading || "Global Opportunities")}</h1>
      <p>${esc(sub || "Advanced search across the full database")} · <b>${num(filtered.length)}</b> of ${num(L.length)} shown</p></div>
    <div class="right">
      <div class="seg">${Object.entries(SORTS).map(([k, v]) => `<button data-sort="${k}" class="${State.ui.sort === k ? "on" : ""}">${v.label}</button>`).join("")}</div>
      <button class="btn" id="exportView">${ic("i-dl")}Export view</button>
    </div>
  </div>

  ${activeChips.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
    ${activeChips.map(c => `<span class="chip on">${esc(c.bool ? titleCase(c.k.replace(/([A-Z])/g, " $1")) : c.v)}
      <button data-unchip="${c.k}" data-val="${esc(String(c.v))}">${ic("i-x", "ic", 2.4)}</button></span>`).join("")}
    <button class="btn btn-xs" id="clearFilters2">Clear all</button>
  </div>` : ""}

  <div class="explorer">
    <div>${filterPanel()}</div>
    <div class="card">
      <div class="card-h"><h3>Results</h3><span class="sub">page ${page} of ${pages}</span>
        <div class="right">
          <select id="pageSize" style="width:auto;height:27px;font-size:12px">
            ${[10, 25, 50, 100].map(n => `<option value="${n}" ${ps === n ? "selected" : ""}>${n} / page</option>`).join("")}
          </select>
        </div></div>
      <div>${oppListHTML(slice)}</div>
      ${pages > 1 ? `<div class="card-b" style="display:flex;gap:8px;align-items:center;justify-content:center;border-top:1px solid var(--line-soft)">
        <button class="btn btn-sm" data-page="${page - 1}" ${page === 1 ? "disabled" : ""}>Previous</button>
        <span class="small muted">Page ${page} / ${pages}</span>
        <button class="btn btn-sm" data-page="${page + 1}" ${page === pages ? "disabled" : ""}>Next</button>
      </div>` : ""}
    </div>
  </div>`;
}
</script>
<script>
"use strict";
/* ============================================================================
   OPPORTUNITY DETAIL DRAWER
   ========================================================================== */
function kvRow(label, value, opts) {
  opts = opts || {};
  const empty = value == null || value === "" || (Array.isArray(value) && !value.length);
  const shown = empty ? (opts.na || "Not on file") : (Array.isArray(value) ? value.join(", ") : value);
  return `<dt>${esc(label)}</dt><dd class="${empty ? "na" : ""}">${opts.html && !empty ? shown : esc(shown)}</dd>`;
}

function openOpportunity(id) {
  const raw = State.opportunities.find(o => o.id === id);
  if (!raw) return;
  const p = State.profile;
  const m = computeMatch(raw, p);
  const comp = competitiveness(raw);
  const rd = readiness(raw);
  const st = stageOf(id);
  const rel = relatedTo(raw, 4);
  const o = raw;

  const head = `<div style="flex:1;min-width:0">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:7px">
        ${statusBadge(o)} ${synBadge(o)}
        <span class="badge b-mut">${esc(o.fundingType || "Funding type unknown")}</span>
        ${st ? `<span class="badge b-acc">${STAGE_META[st].label}</span>` : ""}
      </div>
      <h3 style="font-size:17px;line-height:1.35;letter-spacing:-.02em">${esc(o.title)}</h3>
      <div style="color:var(--tx-2);font-size:13px;margin-top:5px">${
        [o.university, [o.city, o.country].filter(Boolean).join(", ")].filter(Boolean).map(esc).join(" · ")
        || "<span class='muted'>Institution not stated</span>"
      }${!o.city && !o.country ? ` <span class="badge b-mut">location not published on the listing</span>` : ""}</div>
    </div>
    ${matchRing(m.overall, 62)}
    <button class="icon-btn" onclick="closeDrawer()" aria-label="Close">${ic("i-x")}</button>`;

  const partBar = (x) => `<div class="bar-row">
      <span class="bl" title="${esc(x.label)}">${esc(x.label)} <span class="muted small">· w${x.w}</span></span>
      <span class="bb"><span class="pbar"><i style="width:${x.v}%;background:${x.v >= 70 ? "var(--ok)" : x.v >= 40 ? "var(--acc)" : "var(--amber)"}"></i></span></span>
      <span class="bv">${x.v}%</span></div>`;

  const overlapDetail = (x) => {
    if (!x.d || x.d.hits == null) return "";
    const tag = (arr, cls) => arr.map(a => `<span class="badge ${cls}">${esc(a)}</span>`).join(" ");
    return `<div style="margin:-3px 0 11px 0;display:flex;gap:5px;flex-wrap:wrap">
      ${tag(x.d.hits, "b-teal")}${tag(x.d.partial, "b-est")}${tag(x.d.misses, "b-mut")}</div>`;
  };

  const pv = o.provenance;
  const body = `
  ${o.synthetic ? `<div class="notice">${ic("i-warn")}<div><b>Synthetic demo record.</b> The institution, city and country are
    real; everything else on this page — title, deadline, stipend, group, ranking — was generated to exercise the interface.
    Do not act on it.</div></div>` : ""}

  ${pv ? `<div class="dsec">
    <h4>Provenance</h4>
    <div class="card" style="background:var(--panel-2);border-color:${pv.warning ? "color-mix(in srgb,var(--amber) 40%,transparent)" : "var(--line)"}">
      <div class="card-b">
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px">
          <span class="badge b-teal">${ic("i-check", "ic", 2.4)} FETCHED FROM SOURCE</span>
          <span class="badge b-mut">${esc(pv.sourceName)}</span>
          <span class="badge b-mut">fetched ${esc(fmtDate(pv.fetchedAt) || pv.fetchedAt)}</span>
        </div>
        <a class="btn btn-p btn-sm" href="${esc(o.sourceUrl)}" target="_blank" rel="noopener">${ic("i-ext")}Open the original posting</a>
        <div class="small muted" style="margin-top:9px;word-break:break-all">${esc(o.sourceUrl)}</div>

        ${pv.warning ? `<div class="notice" style="margin:12px 0 0">${ic("i-warn")}<div>
          <b>Source page inconsistency:</b> ${esc(pv.warning)}</div></div>` : ""}

        ${(pv.derivedFields || []).length ? `<div class="sep"></div>
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx-3);font-weight:700;margin-bottom:6px">Derived, not printed on the page</div>
          <div style="display:flex;gap:5px;flex-wrap:wrap">${pv.derivedFields.map(d => `<span class="badge b-est">${esc(d)}</span>`).join("")}</div>
          <div class="small muted" style="margin-top:6px">These values were not literally shown. Check them against the original posting before relying on them.</div>` : ""}

        ${(pv.computedFields || []).length ? `<div class="sep"></div>
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx-3);font-weight:700;margin-bottom:6px">Computed by PRIS from page text</div>
          ${pv.computedFields.map(c => `<div class="reqrow"><span class="badge b-est">${esc(c.field)}</span>
            <span class="small muted" style="flex:1">${esc(c.how)}</span></div>`).join("")}` : ""}
      </div>
    </div>
  </div>` : ""}

  ${!o.synthetic && !pv ? `<div class="notice">${ic("i-warn")}<div><b>No provenance recorded.</b> This record was entered
    by hand or imported from a file, so PRIS cannot vouch for where it came from. Verify it against the official posting
    before applying.</div></div>` : ""}

  ${m.blockers.length ? `<div class="notice">${ic("i-warn")}<div><b>${m.blockers.length} eligibility concern${m.blockers.length === 1 ? "" : "s"}:</b>
    <ul style="margin:6px 0 0;padding-left:18px">${m.blockers.map(b => `<li>${esc(b)}</li>`).join("")}</ul></div></div>` : ""}

  <div class="dsec">
    <h4>Match breakdown</h4>
    <div class="card" style="background:var(--panel-2)"><div class="card-b">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap">
        <div style="font-size:30px;font-weight:700;letter-spacing:-.035em">${m.overall == null ? "—" : m.overall}<span style="font-size:16px;color:var(--tx-3)">${m.overall == null ? "" : "%"}</span></div>
        <div class="small muted" style="flex:1;min-width:180px">Weighted average of the components below, using the weights
          you set in Settings. Green = you have it, purple = adjacent field, grey = gap.</div>
      </div>
      ${m.coverage < 100 ? `<div class="notice" style="margin:0 0 12px">${ic("i-warn")}<div>
        <b>Scored on ${m.scoredOn} of 5 components (${m.coverage}% of your weighting).</b>
        This posting did not state required skills, software, programming languages or publication counts, so those
        components are <b>skipped, not passed</b>. A high score here means "the research area fits", not "you meet the
        requirements" — open the original posting for the real requirements.</div></div>` : ""}
      ${m.parts.filter(x => x.v != null).map(x => partBar(x) + overlapDetail(x)).join("")}
      ${m.parts.filter(x => x.v == null).length ? `<div class="sep"></div>
        <div class="small muted">Skipped — this posting states nothing to score against:
        ${m.parts.filter(x => x.v == null).map(x => `<span class="badge b-mut">${esc(x.label)}</span>`).join(" ")}</div>` : ""}
      ${m.parts[4].v != null ? `<div class="small muted" style="margin-top:8px">Publications: your profile lists ${m.parts[4].d.have}, this posting asks for ${m.parts[4].d.need}.</div>` : ""}
    </div></div>
  </div>

  <div class="dsec">
    <h4>Competition intelligence</h4>
    ${o.acceptanceRateOfficial != null ? `
      <div class="card" style="background:var(--panel-2)"><div class="card-b">
        <div style="display:flex;align-items:baseline;gap:10px">
          <div style="font-size:26px;font-weight:700">${o.acceptanceRateOfficial}%</div>
          <span class="badge b-teal">OFFICIAL</span>
        </div>
        <div class="small muted" style="margin-top:6px">Published acceptance rate.
          Source: ${o.acceptanceRateSource ? `<a href="${esc(o.acceptanceRateSource)}" target="_blank" rel="noopener">${esc(o.acceptanceRateSource)}</a>` : "not recorded"}</div>
      </div></div>` : `
      <div class="notice info" style="margin-bottom:10px">${ic("i-info")}<div>
        <b>No official acceptance rate published.</b> PRIS never invents one.</div></div>
      ${!comp.sufficient ? `
      <div class="notice">${ic("i-warn")}<div><b>Not enough real data to estimate competitiveness.</b>
        Only ${comp.realInputs} of the 5 inputs came from this posting — the rest would be my own neutral assumptions,
        so the number would mostly be measuring my guesses rather than the position. The estimate is withheld.
        It appears once the record carries a ranking, a stipend, or stated eligibility requirements.
        <div class="sep"></div>
        <div class="small">Inputs available: ${comp.factors.filter(f => f.real).map(f => esc(f.name)).join(", ") || "none"}</div>
      </div></div>` : `
      <div class="card" style="background:var(--panel-2)"><div class="card-b">
        <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:12px">
          <div style="font-size:26px;font-weight:700">${comp.score}</div>
          <div style="font-size:14px;font-weight:600;color:var(--violet)">${comp.band}</div>
          <span class="badge b-est">ESTIMATE</span>
          <span class="badge b-mut">${comp.realInputs}/5 real inputs</span>
        </div>
        <div class="small muted" style="margin-bottom:10px">A heuristic, not a measurement. Not validated against any
          real outcome data. Rows marked <b>assumed</b> contributed a placeholder, not evidence.</div>
        <div class="formula">
          ${comp.factors.map(f => `<div class="fr" style="${f.real ? "" : "opacity:.6"}">
            <span class="fn">${esc(f.name)} ${f.real ? "" : `<span class="badge b-mut">assumed</span>`}<br><span class="muted small">${esc(f.note)}</span></span>
            <span class="fw">× ${f.weight}</span><span class="fv">${f.value}</span></div>`).join("")}
          <div class="fr" style="border-top:1px solid var(--line);margin-top:5px;padding-top:8px">
            <span class="fn"><b>Weighted total</b></span><span class="fw"></span><span class="fv"><b>${comp.score}</b></span></div>
        </div>
      </div></div>`}`}
  </div>

  <div class="dsec">
    <h4>Application readiness</h4>
    <div class="card" style="background:var(--panel-2)"><div class="card-b">
      <div class="bar-row"><span class="bl">Overall readiness</span>
        <span class="bb"><span class="pbar"><i style="width:${rd.pct}%;background:${rd.pct >= 80 ? "var(--ok)" : rd.pct >= 50 ? "var(--acc)" : "var(--amber)"}"></i></span></span>
        <span class="bv">${rd.pct}%</span></div>
      <div class="sep"></div>
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx-3);font-weight:700;margin-bottom:6px">Eligibility gates</div>
      ${rd.gates.map(g => `<div class="reqrow">
        <span class="st" style="color:${g.ok ? "var(--ok)" : "var(--amber)"}">${ic(g.ok ? "i-check" : "i-warn", "st", 2.2)}</span>
        <span style="flex:1">${esc(g.label)}</span><span class="muted small">${esc(g.detail)}</span></div>`).join("")}
      <div class="sep"></div>
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--tx-3);font-weight:700;margin-bottom:6px">Required documents</div>
      ${rd.rows.length ? rd.rows.map(r => `<div class="reqrow">
        <span class="st" style="color:${r.ok ? "var(--ok)" : "var(--red)"}">${ic(r.ok ? "i-check" : "i-x", "st", 2.2)}</span>
        <span style="flex:1">${esc(r.doc)}</span>
        <span class="muted small">${r.ok ? "marked ready" : "not marked ready"}</span></div>`).join("")
        : `<div class="muted small">No document list recorded for this posting.</div>`}
      ${rd.missing.length ? `<div class="notice" style="margin:12px 0 0">${ic("i-warn")}<div>
        <b>${rd.missing.length} document${rd.missing.length === 1 ? "" : "s"} missing:</b> ${esc(rd.missing.join(", "))}.
        Mark them ready in <b>Documents</b> once prepared.</div></div>` : ""}
    </div></div>
  </div>

  <div class="dsec"><h4>Position</h4><dl class="kv">
    ${kvRow("Department", o.department)}
    ${kvRow("Faculty", o.faculty)}
    ${kvRow("Laboratory", o.laboratory)}
    ${kvRow("Research group", o.researchGroup)}
    ${kvRow("Primary research area", o.researchArea)}
    ${kvRow("Keywords", o.researchKeywords)}
    ${kvRow("Duration", o.durationMonths ? o.durationMonths + " months" : null)}
    ${kvRow("Start date", fmtDate(o.startDate))}
    ${kvRow("Application deadline", fmtDate(o.deadline))}
    ${kvRow("Work mode", o.workMode)}
    ${kvRow("QS ranking", o.qsRank ? o.qsRank + (o.rankSource === "SYNTHETIC" ? " (synthetic)" : "") : null)}
    ${kvRow("THE ranking", o.theRank ? o.theRank + (o.rankSource === "SYNTHETIC" ? " (synthetic)" : "") : null)}
  </dl></div>

  <div class="dsec"><h4>Description</h4>
    <div style="font-size:13px;line-height:1.65;color:var(--tx-2);white-space:pre-wrap">${esc(o.description || "No description on file.")}</div>
  </div>

  <div class="dsec"><h4>Funding & benefits</h4><dl class="kv">
    ${kvRow("Salary, as printed", o.salaryText, { na: "Not stated on the posting" })}
    ${kvRow("Funding agency", o.fundingAgency)}
    ${kvRow("Funding type", o.fundingType)}
    ${kvRow("Monthly stipend", o.stipendMonthly != null ? stipendText(o) : null, { html: true })}
    ${kvRow("Annual funding", o.annualFunding != null ? o.currency + " " + num(o.annualFunding) : null)}
    ${kvRow("Research grant", o.researchGrant != null ? o.currency + " " + num(o.researchGrant) : null)}
    ${kvRow("Conference grant", o.conferenceGrant != null ? o.currency + " " + num(o.conferenceGrant) : null)}
    ${kvRow("Travel grant", o.travelGrant != null ? o.currency + " " + num(o.travelGrant) : null)}
    ${kvRow("Accommodation", o.accommodation ? "Provided / supported" : "Not indicated")}
    ${kvRow("Medical insurance", o.medicalInsurance ? "Included" : "Not indicated")}
    ${kvRow("Visa sponsorship", o.visaSponsorship ? "Yes" : "Not indicated")}
    ${kvRow("Flight ticket", o.flightTicket ? "Yes" : "Not indicated")}
    ${kvRow("Relocation support", o.relocationSupport ? "Yes" : "Not indicated")}
    ${kvRow("Family support", o.familySupport ? "Yes" : "Not indicated")}
  </dl></div>

  <div class="dsec"><h4>Requirements</h4><dl class="kv">
    ${kvRow("Required degree", o.requiredDegree)}
    ${kvRow("Experience", o.requiredExperienceYears != null ? o.requiredExperienceYears + " years" : null)}
    ${kvRow("Publications expected", o.requiredPublications)}
    ${kvRow("Skills", o.requiredSkills)}
    ${kvRow("Software", o.requiredSoftware)}
    ${kvRow("Programming", o.requiredLanguages)}
    ${kvRow("Language", o.requiredSpokenLanguage)}
    ${kvRow("Citizenship restriction", o.citizenshipRestriction, { na: "None recorded" })}
    ${kvRow("Age / career-stage limit", o.ageRestriction, { na: "None recorded" })}
    ${kvRow("Required documents", o.requiredDocuments)}
  </dl></div>

  <div class="dsec"><h4>Principal investigator</h4>
    ${o.professorEmail || o.professorName ? "" : `<div class="notice info" style="margin-bottom:10px">${ic("i-info")}<div>
      <b>PRIS never generates a professor's name or email address.</b> Pattern-guessed institutional addresses
      (<span class="mono">first.last@uni.edu</span>) are frequently correct, which is precisely what makes them dangerous —
      you would be writing to an unverified, possibly wrong, recipient. Open the faculty page, copy the address as
      published, and paste it here.</div></div>`}
    <dl class="kv">
      ${kvRow("Name", o.professorName, { na: o.professorLabel ? o.professorLabel + " — name not recorded" : "Not recorded" })}
      ${kvRow("Position", o.professorPosition)}
      ${kvRow("Email", o.professorEmail, { na: "Not recorded — fill from the faculty page" })}
      ${kvRow("Research interests", o.professorInterests)}
      ${kvRow("Google Scholar", o.scholarUrl ? `<a href="${esc(o.scholarUrl)}" target="_blank" rel="noopener">${esc(o.scholarUrl)}</a>` : null, { html: true })}
      ${kvRow("ORCID", o.orcid)}
      ${kvRow("ResearchGate", o.researchGate ? `<a href="${esc(o.researchGate)}" target="_blank" rel="noopener">${esc(o.researchGate)}</a>` : null, { html: true })}
      ${kvRow("Laboratory website", o.labWebsite ? `<a href="${esc(o.labWebsite)}" target="_blank" rel="noopener">${esc(o.labWebsite)}</a>` : null, { html: true })}
    </dl>
    <div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">
      ${o.labWebsite ? `<a class="btn btn-sm" href="${esc(o.labWebsite)}" target="_blank" rel="noopener">${ic("i-ext")}Open faculty / lab page</a>` : ""}
      <button class="btn btn-sm" data-editpi="${o.id}">${ic("i-edit")}Record PI details</button>
    </div>
  </div>

  <div class="dsec"><h4>Process & links</h4><dl class="kv">
    ${kvRow("Application portal", o.applicationPortal)}
    ${kvRow("Interview process", o.interviewProcess)}
    ${kvRow("Selection procedure", o.selectionProcedure)}
    ${kvRow("Expected timeline", o.expectedTimelineWeeks ? o.expectedTimelineWeeks + " weeks" : null)}
    ${kvRow("Official website", o.officialWebsite ? `<a href="${esc(o.officialWebsite)}" target="_blank" rel="noopener">${esc(o.officialWebsite)}</a>` : null, { html: true })}
    ${kvRow("Application link", o.applicationLink ? `<a href="${esc(o.applicationLink)}" target="_blank" rel="noopener">${esc(o.applicationLink)}</a>` : null, { html: true })}
    ${kvRow("Source URL", o.sourceUrl ? `<a href="${esc(o.sourceUrl)}" target="_blank" rel="noopener">${esc(o.sourceUrl)}</a>` : null, { html: true })}
    ${kvRow("Last verified", fmtDate(o.lastVerified), { na: "Never verified" })}
    ${kvRow("Record ID", o.id)}
  </dl></div>

  <div class="dsec"><h4>Your notes</h4>
    <textarea id="oppNotes" placeholder="Private notes on this position — contacts made, questions to ask, fit concerns…">${esc((State.applications[o.id] || {}).notes || "")}</textarea>
    <div style="display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-sm" data-savenote="${o.id}">Save notes</button>
      <label class="fl" style="margin:0 0 0 8px">Reminder</label>
      <input type="date" style="width:auto" id="oppReminder" value="${esc((State.applications[o.id] || {}).reminder || "")}"/>
      <button class="btn btn-sm" data-savereminder="${o.id}">Set</button>
    </div>
  </div>

  ${rel.length ? `<div class="dsec"><h4>Related opportunities</h4>
    ${withComputed(rel).map(r => `<div class="pcard" data-opp="${r.id}" style="margin-bottom:7px">
      <div class="t">${esc(r.title)} ${synBadge(r)}</div>
      <div class="s">${esc(r.university)} · ${esc(r.country)} · match ${r._match}%</div></div>`).join("")}
  </div>` : ""}

  <div class="dsec"><h4>Timeline</h4>
    <div class="timeline">
      ${(State.applications[o.id] && State.applications[o.id].events || []).map(e => `<div class="tl-item on">
        <div class="tt">${esc(STAGE_META[e.stage] ? STAGE_META[e.stage].label : e.stage)}</div>
        <div class="td">${esc(fmtDate(e.at) || e.at)}${e.note ? " · " + esc(e.note) : ""}</div></div>`).join("")
      || `<div class="muted small">No activity recorded yet.</div>`}
    </div>
  </div>`;

  const foot = `
    <button class="btn ${o.favourite ? "btn-p" : ""}" data-fav="${o.id}">${o.favourite ? "★ Favourited" : "☆ Favourite"}</button>
    ${STAGES.map(s => `<button class="btn ${st === s ? "btn-p" : ""}" data-stage="${o.id}|${s}">${STAGE_META[s].label}</button>`).join("")}
    ${st ? `<button class="btn btn-d" data-stage="${o.id}|__clear">Remove from pipeline</button>` : ""}
    <span style="flex:1"></span>
    <button class="btn" data-edit="${o.id}">${ic("i-edit")}Edit record</button>
    ${o.applicationLink ? `<a class="btn btn-p" href="${esc(o.applicationLink)}" target="_blank" rel="noopener">${ic("i-ext")}Apply</a>` : ""}`;

  openDrawer(head, body, foot);
}
</script>
<script>
"use strict";
/* ============================================================================
   PAGE: RESEARCH ANALYTICS
   ========================================================================== */
function pageAnalytics() {
  const L = withComputed(State.opportunities);
  if (!L.length) return emptyDB("Analytics");

  const byCountry = countBy(L, o => o.country).slice(0, 14);
  const byUni = countBy(L, o => o.university).slice(0, 14);
  const byArea = countBy(L, o => o.researchArea).slice(0, 14);
  const byAgency = countBy(L, o => o.fundingAgency).slice(0, 10);
  const bySoft = SOFTWARE.map(s => ({ k: s, v: L.filter(o => (o.requiredSoftware || []).includes(s)).length })).sort((a, b) => b.v - a.v);
  const byLang = LANGS.map(s => ({ k: s, v: L.filter(o => (o.requiredLanguages || []).includes(s)).length })).sort((a, b) => b.v - a.v);
  const byMode = countBy(L, o => o.workMode);

  // Stipend by country (median, USD)
  const stipendRows = Object.entries(L.reduce((m, o) => { (m[o.country] = m[o.country] || []).push(toUSD(o.stipendMonthly, o.currency)); return m; }, {}))
    .map(([k, v]) => { const c = v.filter(x => x != null); return { k, v: c.length ? Math.round(median(c)) : 0, n: c.length }; })
    .filter(r => r.v > 0).sort((a, b) => b.v - a.v).slice(0, 16)
    .map(r => ({ k: r.k, v: r.v, label: "$" + num(r.v) }));

  // Deadline distribution by month
  const months = {};
  L.forEach(o => { if (o.deadline) months[o.deadline.slice(0, 7)] = (months[o.deadline.slice(0, 7)] || 0) + 1; });
  const monthRows = Object.entries(months).sort().map(([k, v]) => ({ k, short: k.slice(2), v }));

  // Match distribution
  const buckets = [[0,20],[20,40],[40,60],[60,80],[80,101]];
  const matchRows = buckets.map(([a, b]) => ({ k: a + "–" + (b === 101 ? 100 : b) + "%", v: L.filter(o => o._match >= a && o._match < b).length,
    color: b <= 40 ? CAT[4] : b <= 60 ? CAT[2] : b <= 80 ? CAT[0] : CAT[1] }));

  // Benefits coverage
  const ben = [
    ["Visa sponsorship", L.filter(o => o.visaSponsorship).length],
    ["Medical insurance", L.filter(o => o.medicalInsurance).length],
    ["Relocation support", L.filter(o => o.relocationSupport).length],
    ["Flight ticket", L.filter(o => o.flightTicket).length],
    ["Accommodation", L.filter(o => o.accommodation).length],
    ["Family support", L.filter(o => o.familySupport).length]
  ].map(([k, v]) => ({ k, v, label: v + " (" + Math.round(v / L.length * 100) + "%)" }));

  // Application funnel
  const funnel = STAGES.map(s => ({ k: STAGE_META[s].label, v: Object.values(State.applications).filter(a => a.stage === s).length, color: STAGE_META[s].color }));

  // Deadline calendar for the next 3 months
  const byDate = {};
  L.forEach(o => { if (o.deadline) (byDate[o.deadline] = byDate[o.deadline] || []).push(o); });
  const now = new Date();
  const calMonths = [0, 1, 2].map(i => {
    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    return { y: d.getFullYear(), m: d.getMonth(), label: d.toLocaleDateString(undefined, { month: "long", year: "numeric" }) };
  });

  return `
  <div class="hdr"><div><h1>Research Analytics</h1>
    <p>Aggregate view across ${num(L.length)} records${L.filter(o => o.synthetic).length ? " (includes synthetic demo data)" : ""}</p></div>
    <div class="right"><button class="btn" id="exportAll">${ic("i-dl")}Export CSV</button></div></div>

  <div class="card" style="margin-bottom:16px"><div class="card-b">
    <div class="stat-inline">
      <div><div class="l">Records</div><div class="v">${num(L.length)}</div></div>
      <div><div class="l">Open</div><div class="v">${num(L.filter(o => o.status !== "Closed").length)}</div></div>
      <div><div class="l">Countries</div><div class="v">${num(uniq(L.map(o => o.country)).length)}</div></div>
      <div><div class="l">Institutions</div><div class="v">${num(uniq(L.map(o => o.university)).length)}</div></div>
      <div><div class="l">Median stipend</div><div class="v">$${num(median(L.map(o => toUSD(o.stipendMonthly, o.currency)).filter(v => v != null)))}</div></div>
      <div><div class="l">Median duration</div><div class="v">${num(median(L.map(o => o.durationMonths).filter(Boolean)))} mo</div></div>
      <div><div class="l">Mean match</div><div class="v">${Math.round(avg(L.map(o => o._match)))}%</div></div>
      <div><div class="l">Synthetic</div><div class="v" style="color:var(--amber)">${num(L.filter(o => o.synthetic).length)}</div></div>
    </div></div></div>

  <div class="grid g-2" style="margin-bottom:16px">
    <div class="card"><div class="card-h"><h3>Positions by country</h3></div><div class="card-b">${barChartH(byCountry, { seq: true })}</div></div>
    <div class="card"><div class="card-h"><h3>Positions by institution</h3></div><div class="card-b">${barChartH(byUni, { labelW: 190, seq: true })}</div></div>
  </div>

  <div class="grid g-2" style="margin-bottom:16px">
    <div class="card"><div class="card-h"><h3>Median stipend by country</h3><span class="sub">≈ USD/month, approximate FX</span></div>
      <div class="card-b">${barChartH(stipendRows, { seq: true })}</div></div>
    <div class="card"><div class="card-h"><h3>Research area distribution</h3></div>
      <div class="card-b">${barChartH(byArea, { labelW: 200 })}</div></div>
  </div>

  <div class="grid g-2" style="margin-bottom:16px">
    <div class="card"><div class="card-h"><h3>Deadlines by month</h3></div><div class="card-b">${monthRows.length ? colChart(monthRows) : `<div class="muted small">No deadlines on file.</div>`}</div></div>
    <div class="card"><div class="card-h"><h3>Match score distribution</h3><span class="sub">your profile vs. the database</span></div>
      <div class="card-b">${colChart(matchRows, { h: 210 })}</div></div>
  </div>

  <div class="grid g-3" style="margin-bottom:16px">
    <div class="card"><div class="card-h"><h3>Work mode</h3></div>
      <div class="card-b" style="text-align:center">${donut(byMode, { centre: "positions" })}${legendHTML(byMode)}</div></div>
    <div class="card"><div class="card-h"><h3>Application funnel</h3></div>
      <div class="card-b">${sum(funnel.map(f => f.v)) ? barChartH(funnel, { labelW: 100 }) : `<div class="muted small">No applications tracked yet. Save an opportunity to start.</div>`}</div></div>
    <div class="card"><div class="card-h"><h3>Benefits coverage</h3></div>
      <div class="card-b">${barChartH(ben, { labelW: 130, seq: true })}</div></div>
  </div>

  <div class="grid g-2" style="margin-bottom:16px">
    <div class="card"><div class="card-h"><h3>Software demand</h3><span class="sub">how often each tool is required</span></div>
      <div class="card-b">${barChartH(bySoft.filter(s => s.v), { labelW: 120, seq: true })}</div></div>
    <div class="card"><div class="card-h"><h3>Programming language demand</h3></div>
      <div class="card-b">${barChartH(byLang.filter(s => s.v), { labelW: 120, seq: true })}</div></div>
  </div>

  <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Funding agencies</h3></div>
    <div class="card-b">${barChartH(byAgency, { labelW: 250 })}</div></div>

  <div class="card"><div class="card-h"><h3>Deadline calendar</h3><span class="sub">next three months · amber days carry deadlines</span></div>
    <div class="card-b grid g-3">
      ${calMonths.map(cm => `<div><div style="font-size:12.5px;font-weight:600;margin-bottom:8px">${esc(cm.label)}</div>
        ${calendarHTML(cm.y, cm.m, byDate)}</div>`).join("")}
    </div></div>`;
}

/* ============================================================================
   PAGE: SAVED
   ========================================================================== */
function pageSaved() {
  const L = withComputed(State.opportunities).filter(o => stageOf(o.id) === "saved" || o.favourite);
  const sorted = sortList(L);
  return `
  <div class="hdr"><div><h1>Saved</h1><p>${num(sorted.length)} saved or favourited positions</p></div>
    <div class="right"><div class="seg">${Object.entries(SORTS).map(([k, v]) => `<button data-sort="${k}" class="${State.ui.sort === k ? "on" : ""}">${v.label}</button>`).join("")}</div></div></div>
  <div class="card">${oppListHTML(sorted, "Save an opportunity from the explorer and it will appear here.")}</div>`;
}

/* ============================================================================
   PAGE: APPLICATION TRACKER
   ========================================================================== */
function pageApplied() {
  const L = withComputed(State.opportunities);
  const byStage = {};
  STAGES.forEach(s => byStage[s] = L.filter(o => stageOf(o.id) === s));
  const total = sum(STAGES.map(s => byStage[s].length));
  const decided = byStage.offer.length + byStage.accepted.length + byStage.rejected.length;
  const succ = decided ? Math.round((byStage.offer.length + byStage.accepted.length) / decided * 100) : null;

  const upcoming = L.filter(o => stageOf(o.id) && o.deadline && daysBetween(todayISO(), o.deadline) >= 0)
    .sort((a, b) => String(a.deadline).localeCompare(String(b.deadline))).slice(0, 8);
  const reminders = Object.entries(State.applications).filter(([, a]) => a.reminder)
    .map(([id, a]) => ({ o: L.find(x => x.id === id), r: a.reminder })).filter(x => x.o)
    .sort((a, b) => String(a.r).localeCompare(String(b.r)));

  return `
  <div class="hdr"><div><h1>Application Tracker</h1>
    <p>${num(total)} tracked · ${num(decided)} decided${succ != null ? ` · ${succ}% positive outcome rate` : ""}</p></div>
    <div class="right"><button class="btn" id="exportApps">${ic("i-dl")}Export tracker</button></div></div>

  ${total === 0 ? `<div class="notice info">${ic("i-info")}<div>Nothing tracked yet. Open any opportunity and use the
    buttons at the bottom of the panel to move it through Saved → Applied → Interview → Offer.</div></div>` : ""}

  <div class="grid g-kpi" style="margin-bottom:16px">
    ${STAGES.map(s => `<div class="kpi"><div class="lab" style="color:${STAGE_META[s].color}">${STAGE_META[s].label}</div>
      <div class="val">${num(byStage[s].length)}</div>
      <div class="meta">${total ? Math.round(byStage[s].length / total * 100) : 0}% of pipeline</div></div>`).join("")}
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-h"><h3>Pipeline</h3><span class="sub">click a card to open the full record</span></div>
    <div class="card-b">
      <div class="pipe">${STAGES.map(s => `<div class="pipe-col">
        <div class="pipe-h" style="color:${STAGE_META[s].color}">${ic(STAGE_META[s].icon, "ic", 1.9)}${STAGE_META[s].label}
          <span class="n">${byStage[s].length}</span></div>
        <div class="pipe-b">${byStage[s].map(o => `<div class="pcard" data-opp="${o.id}">
          <div class="t">${esc(o.title.length > 62 ? o.title.slice(0, 60) + "…" : o.title)}</div>
          <div class="s">${esc(o.university)} · ${esc(o.country)}</div>
          <div class="s" style="margin-top:4px">${deadlineText(o)}</div>
        </div>`).join("") || `<div class="muted small" style="padding:8px 4px">Empty</div>`}</div>
      </div>`).join("")}</div>
    </div>
  </div>

  <div class="grid g-2">
    <div class="card"><div class="card-h"><h3>Upcoming deadlines in your pipeline</h3></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Position</th><th>Stage</th><th>Deadline</th><th style="text-align:right">Days</th></tr></thead>
      <tbody>${upcoming.map(o => `<tr class="clickable" data-opp="${o.id}">
        <td><b>${esc(o.title.length > 54 ? o.title.slice(0, 52) + "…" : o.title)}</b><br><span class="muted small">${esc(o.university)}</span></td>
        <td><span class="badge b-acc">${STAGE_META[stageOf(o.id)].label}</span></td>
        <td>${fmtDate(o.deadline)}</td>
        <td style="text-align:right" class="tnum">${daysBetween(todayISO(), o.deadline)}</td></tr>`).join("")
        || `<tr><td colspan="4" class="muted small">Nothing upcoming.</td></tr>`}</tbody></table></div></div>

    <div class="card"><div class="card-h"><h3>Reminders</h3></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Position</th><th>Reminder date</th><th></th></tr></thead>
      <tbody>${reminders.map(r => `<tr class="clickable" data-opp="${r.o.id}">
        <td>${esc(r.o.title.length > 48 ? r.o.title.slice(0, 46) + "…" : r.o.title)}</td>
        <td>${fmtDate(r.r)}</td>
        <td>${r.r <= todayISO() ? `<span class="badge b-soon">Due</span>` : `<span class="badge b-mut">Scheduled</span>`}</td></tr>`).join("")
        || `<tr><td colspan="3" class="muted small">No reminders set. Set one from any opportunity panel.</td></tr>`}</tbody></table></div></div>
  </div>`;
}

/* ============================================================================
   PAGE: DOCUMENTS
   ========================================================================== */
function pageDocs() {
  const docs = State.documents;
  const required = {};
  State.opportunities.forEach(o => {
    if (!stageOf(o.id)) return;
    (o.requiredDocuments || []).forEach(d => required[d] = (required[d] || 0) + 1);
  });
  const readyN = docs.filter(d => d.ready).length;

  return `
  <div class="hdr"><div><h1>Document Center</h1>
    <p>${readyN} of ${docs.length} marked ready</p></div>
    <div class="right"><button class="btn btn-p" id="addDoc">${ic("i-plus")}Add document</button></div></div>

  <div class="notice info">${ic("i-info")}<div>This is a <b>readiness register</b>, not file storage. It records which
    documents you have prepared and when you last revised them, so the readiness check on each opportunity is accurate.
    Files themselves stay on your disk; attach a path or a link if that helps you find them. File upload arrives with the
    backend build.</div></div>

  <div class="grid g-2">
    <div class="card"><div class="card-h"><h3>Your documents</h3></div><div class="card-b">
      ${docs.length ? docs.map(d => `<div class="docrow">
        <div class="di" style="color:${d.ready ? "var(--ok)" : "var(--tx-3)"}">${ic("i-doc", "ic", 1.7)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600">${esc(d.type)}${d.label ? ` <span class="muted small">— ${esc(d.label)}</span>` : ""}</div>
          <div class="muted small">${d.updated ? "Updated " + fmtDate(d.updated) : "Never updated"}${d.location ? " · " + esc(d.location) : ""}</div>
        </div>
        <label class="switch"><input type="checkbox" data-docready="${d.id}" ${d.ready ? "checked" : ""}/> Ready</label>
        <button class="btn btn-xs" data-doceditid="${d.id}">${ic("i-edit", "ic", 2)}</button>
        <button class="btn btn-xs btn-d" data-docdel="${d.id}">${ic("i-trash", "ic", 2)}</button>
      </div>`).join("") : `<div class="empty">${ic("i-doc", "ic")}<h4>No documents registered</h4>
        <p>Add the documents you have prepared so readiness checks work.</p>
        <button class="btn btn-p" id="addDoc2">${ic("i-plus")}Add document</button></div>`}
    </div></div>

    <div class="card"><div class="card-h"><h3>Demanded by your pipeline</h3>
      <span class="sub">across tracked positions</span></div>
      <div class="card-b">
      ${Object.keys(required).length ? Object.entries(required).sort((a, b) => b[1] - a[1]).map(([d, n]) => {
        const have = docs.some(x => x.type === d && x.ready);
        return `<div class="reqrow">
          <span class="st" style="color:${have ? "var(--ok)" : "var(--red)"}">${ic(have ? "i-check" : "i-x", "st", 2.2)}</span>
          <span style="flex:1">${esc(d)}</span>
          <span class="muted small">${n} position${n === 1 ? "" : "s"}</span></div>`;
      }).join("") : `<div class="muted small">Track some positions and their required documents will be summarised here.</div>`}
    </div></div>
  </div>`;
}

function emptyDB(what) {
  return `<div class="hdr"><div><h1>${esc(what)}</h1></div></div>
    <div class="card"><div class="empty">${ic("i-db", "ic")}<h4>Database is empty</h4>
      <p>Import a CSV in Data Manager, or restore the synthetic demo set to explore the interface.</p>
      <button class="btn btn-p" data-route="admin">${ic("i-ul")}Open Data Manager</button></div></div>`;
}
</script>
<script>
"use strict";
/* ============================================================================
   PAGE: PROFESSOR INTELLIGENCE
   ========================================================================== */
function pageProfessor() {
  const L = withComputed(State.opportunities).filter(o => /professor/i.test(o.fundingType || "") || o.professorName || o.professorEmail);
  const groups = {};
  L.forEach(o => {
    const key = (o.professorName || o.professorLabel || "Unattributed") + " · " + o.university;
    (groups[key] = groups[key] || []).push(o);
  });
  const rows = Object.entries(groups).map(([k, list]) => ({ k, list })).sort((a, b) => b.list.length - a.list.length);
  const withEmail = L.filter(o => o.professorEmail).length;
  const withName = L.filter(o => o.professorName).length;

  return `
  <div class="hdr"><div><h1>Professor Projects</h1>
    <p>${num(L.length)} PI-linked positions · ${num(rows.length)} distinct PIs</p></div></div>

  <div class="notice">${ic("i-warn")}<div><b>${num(L.length - withName)} of ${num(L.length)} records have no PI name and
    ${num(L.length - withEmail)} have no email.</b> That is deliberate: PRIS does not generate researcher names or
    pattern-guess institutional addresses. Open the lab page from any record, copy what is actually published, and
    record it — the field then carries a verification date. A server-side enrichment service that fetches and extracts

/* ============================================================================
   CSV / JSON
   ========================================================================== */
const CSV_FIELDS = ["id","synthetic","title","university","department","faculty","laboratory","researchGroup",
  "country","city","qsRank","theRank","officialWebsite","applicationLink","applicationPortal","fundingAgency",
  "fundingType","professorName","professorPosition","professorEmail","professorInterests","scholarUrl","orcid",
  "researchGate","labWebsite","description","researchArea","researchKeywords","durationMonths","startDate",
  "deadline","status","requiredDegree","requiredExperienceYears","requiredPublications","requiredSkills",
  "requiredSoftware","requiredLanguages","requiredSpokenLanguage","citizenshipRestriction","ageRestriction",
  "requiredDocuments","stipendMonthly","currency","annualFunding","researchGrant","conferenceGrant","travelGrant",
  "accommodation","medicalInsurance","visaSponsorship","flightTicket","relocationSupport","familySupport",
  "workMode","interviewProcess","selectionProcedure","expectedTimelineWeeks","acceptanceRateOfficial",
  "acceptanceRateSource","sourceUrl","lastVerified","createdAt","internalNotes","userRating","favourite"];

function csvCell(v) {
  if (v == null) return "";
  if (Array.isArray(v)) v = v.join("; ");
  if (typeof v === "boolean") v = v ? "TRUE" : "FALSE";
  v = String(v);
  return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function toCSV(list, extraCols) {
  const cols = CSV_FIELDS.concat(extraCols || []);
  const head = cols.join(",");
  const body = list.map(o => cols.map(c => csvCell(c === "DATA_ORIGIN" ? (o.synthetic ? "SYNTHETIC-DEMO" : "IMPORTED") : o[c])).join(",")).join("\n");
  return head + "\n" + body;
}
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  text = text.replace(/^﻿/, "");
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else {
      if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
      else if (c === "\r") { /* skip */ }
      else cell += c;
    }
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ""));
}
const BOOL_F = new Set(["accommodation","medicalInsurance","visaSponsorship","flightTicket","relocationSupport","familySupport","favourite","synthetic"]);
const NUM_F  = new Set(["qsRank","theRank","durationMonths","requiredExperienceYears","requiredPublications","stipendMonthly","annualFunding","researchGrant","conferenceGrant","travelGrant","expectedTimelineWeeks","acceptanceRateOfficial","userRating"]);
const ARR_F  = new Set(["researchKeywords","requiredSkills","requiredSoftware","requiredLanguages","requiredDocuments"]);

function coerce(field, raw) {
  const v = String(raw == null ? "" : raw).trim();
  if (v === "") return ARR_F.has(field) ? [] : (BOOL_F.has(field) ? false : null);
  if (BOOL_F.has(field)) return /^(true|yes|y|1)$/i.test(v);
  if (NUM_F.has(field)) { const n = Number(v.replace(/[, ]/g, "")); return isNaN(n) ? null : n; }
  if (ARR_F.has(field)) return v.split(/[;|]/).map(s => s.trim()).filter(Boolean);
  return v;
}
function importRows(rows) {
  if (!rows.length) return { added: 0, errors: ["File is empty"] };
  const head = rows[0].map(h => String(h).trim());
  const errors = [];
  const idx = {};
  head.forEach((h, i) => { if (CSV_FIELDS.includes(h)) idx[h] = i; });
  if (idx.title == null) return { added: 0, errors: ["No 'title' column found. Download the template for the expected header row."] };
  const added = [];
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    const o = { id: uid("opp"), synthetic: false, createdAt: todayISO(), lastVerified: todayISO(),
      favourite: false, userRating: 0, internalNotes: "",
      professorEmail: null, professorName: null, acceptanceRateOfficial: null, acceptanceRateSource: null };
    Object.entries(idx).forEach(([f, i]) => { o[f] = coerce(f, row[i]); });
    if (!o.title) { errors.push("Row " + (r + 1) + ": missing title — skipped"); continue; }
    if (!o.country || !CBY[o.country]) errors.push("Row " + (r + 1) + ": country \"" + (o.country || "") + "\" is not in the reference list — it will not appear on the map");
    o.id = uid("opp");
    o.synthetic = false;     // imported data is never marked synthetic
    if (!o.currency && CBY[o.country]) o.currency = CBY[o.country].cur;
    if (!o.researchArea && (o.researchKeywords || []).length) o.researchArea = o.researchKeywords[0];
    added.push(o);
  }
  State.opportunities = State.opportunities.concat(added);
  recomputeStatus(); persist();
  return { added: added.length, errors };
}
function download(filename, content, mime) {
  const blob = new Blob([content], { type: mime || "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
}
