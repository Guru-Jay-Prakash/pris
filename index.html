    <p>This build has no ingestion record attached.</p></div></div>`;

  const counts = {};
  State.opportunities.forEach(o => {
    const k = o.provenance ? o.provenance.sourceId : "_manual";
    counts[k] = (counts[k] || 0) + 1;
  });
  const manual = counts._manual || 0;
  const order = ["OK", "QUARANTINED", "FAILED", "REJECTED", "BLOCKED"];
  const groups = order.map(st => ({ st, list: meta.sources.filter(s => s.status === st) })).filter(g => g.list.length);
  const age = daysBetween(meta.builtAt, todayISO());

  return `
  <div class="hdr"><div><h1>Data Sources</h1>
    <p>Last refresh ${esc(fmtDate(meta.builtAt) || meta.builtAt)}${age > 0 ? ` · ${age} day${age === 1 ? "" : "s"} ago` : " · today"} ·
    ${num(meta.counts.accepted)} records accepted, ${num(meta.counts.rejected)} rejected at ingest</p></div></div>

  ${age >= 3 ? `<div class="notice">${ic("i-warn")}<div><b>This data is ${age} days old.</b> The scheduled refresh has not
    run, or its output has not reached this file. Deadlines shown may already have passed — check the original posting
    before acting on anything.</div></div>` : ""}

  <div class="notice info">${ic("i-info")}<div><b>Every record in PRIS carries the URL it came from.</b> Nothing is
    generated. Where a site refuses automated access, it is listed below as not polled rather than worked around — and
    where a fetch produced content that could not be trusted, the whole source is quarantined and its records discarded.</div></div>

  <div class="grid g-kpi" style="margin-bottom:16px">
    <div class="kpi"><div class="lab">Records</div><div class="val">${num(State.opportunities.length)}</div>
      <div class="meta">${manual ? manual + " added by hand" : "all from sources"}</div></div>
    <div class="kpi"><div class="lab">Sources polled</div><div class="val">${num(meta.sources.filter(s => s.status === "OK").length)}</div>
      <div class="meta">of ${meta.sources.length} evaluated</div></div>
    <div class="kpi"><div class="lab">Quarantined</div><div class="val" style="color:var(--red)">${num(meta.sources.filter(s => s.status === "QUARANTINED").length)}</div>
      <div class="meta">failed the control probe</div></div>
    <div class="kpi"><div class="lab">Blocked by robots.txt</div><div class="val" style="color:var(--tx-2)">${num(meta.sources.filter(s => s.status === "BLOCKED").length)}</div>
      <div class="meta">not polled, by their rules</div></div>
    <div class="kpi"><div class="lab">With a deadline</div><div class="val">${num(meta.counts.withDeadline)}</div>
      <div class="meta">of ${num(meta.counts.accepted)} — rest do not state one</div></div>
    <div class="kpi"><div class="lab">With a stipend figure</div><div class="val">${num(meta.counts.withStipend)}</div>
      <div class="meta">parsed from printed salary text</div></div>
  </div>

  ${groups.map(g => `<div class="card" style="margin-bottom:14px">
    <div class="card-h"><h3>${SRC_STATUS[g.st].label}</h3><span class="sub">${SRC_STATUS[g.st].blurb}</span></div>
    <div>${g.list.map(s => `<div style="padding:14px 18px;border-bottom:1px solid var(--line-soft)">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:7px">
        <span class="badge ${SRC_STATUS[g.st].cls}">${SRC_STATUS[g.st].label}</span>
        <b style="font-size:13.5px">${esc(s.name)}</b>
        ${counts[s.id] ? `<span class="badge b-acc">${counts[s.id]} records</span>` : `<span class="badge b-mut">0 records</span>`}
      </div>
      <div class="small muted" style="margin-bottom:7px;line-height:1.6">${esc(s.note)}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${s.listUrls.map(u => `<a class="chip" href="${esc(u)}" target="_blank" rel="noopener">${ic("i-ext","ic",1.9)}${esc(u.length > 62 ? u.slice(0, 60) + "…" : u)}</a>`).join("")}
      </div>
    </div>`).join("")}</div>
  </div>`).join("")}

  <div class="card">
    <div class="card-h"><h3>How a record earns its place</h3></div>
    <div class="card-b">
      <div class="reqrow"><span class="st" style="color:var(--ok)">${ic("i-check","st",2.2)}</span>
        <span style="flex:1">It has an individual posting URL you can open</span><span class="muted small">no URL, no record</span></div>
      <div class="reqrow"><span class="st" style="color:var(--ok)">${ic("i-check","st",2.2)}</span>
        <span style="flex:1">Its source passed a control probe that run</span><span class="muted small">invalid URLs must return errors, not content</span></div>
      <div class="reqrow"><span class="st" style="color:var(--ok)">${ic("i-check","st",2.2)}</span>
        <span style="flex:1">Every field was literally on the fetched page</span><span class="muted small">absent → null, never completed</span></div>
      <div class="reqrow"><span class="st" style="color:var(--ok)">${ic("i-check","st",2.2)}</span>
        <span style="flex:1">Derived and computed values are labelled as such</span><span class="muted small">see Provenance on any record</span></div>
      <div class="reqrow"><span class="st" style="color:var(--ok)">${ic("i-check","st",2.2)}</span>
        <span style="flex:1">Contradictions on the source page are surfaced, not silently resolved</span><span class="muted small">amber warning on the record</span></div>
    </div>
  </div>`;
}

/* ============================================================================
   PAGE: SETTINGS
   ========================================================================== */
function pageSettings() {
  const p = State.profile;
  const chipList = (arr, all, key) => `<div style="display:flex;flex-wrap:wrap;gap:6px">
    ${all.map(a => `<span class="chip ${arr.includes(a) ? "on" : ""}" data-toggle="${key}|${esc(a)}" style="cursor:pointer">${esc(a)}</span>`).join("")}</div>`;
  const wsum = sum(Object.values(p.weights));

  return `
  <div class="hdr"><div><h1>Settings</h1><p>Your profile drives every match score in the system</p></div>
    <div class="right"><button class="btn btn-p" id="saveProfile">Save profile</button></div></div>

  <div class="grid g-2" style="margin-bottom:16px">
    <div class="card"><div class="card-h"><h3>Researcher profile</h3></div><div class="card-b">
      <div class="field"><label class="fl">Name</label><input type="text" data-p="name" value="${esc(p.name)}"/></div>
      <div class="field"><label class="fl">Title</label><input type="text" data-p="title" value="${esc(p.title)}"/></div>
      <div class="field"><label class="fl">Email</label><input type="email" data-p="email" value="${esc(p.email || "")}"/></div>
      <div class="field"><label class="fl">Nationality</label><select data-p="nationality">
        ${COUNTRIES.map(c => `<option ${p.nationality === c.n ? "selected" : ""}>${esc(c.n)}</option>`).join("")}</select></div>
      <div class="field"><label class="fl">PhD award year</label><input type="number" data-p="phdYear" value="${esc(p.phdYear || "")}"/></div>
      <div class="grid" style="grid-template-columns:1fr 1fr 1fr;gap:0 12px">
        <div class="field"><label class="fl">Journal papers</label><input type="number" data-pub="journal" value="${p.publications.journal}"/></div>
        <div class="field"><label class="fl">Conference papers</label><input type="number" data-pub="conference" value="${p.publications.conference}"/></div>
        <div class="field"><label class="fl">Q1 papers</label><input type="number" data-pub="q1" value="${p.publications.q1}"/></div>
      </div>
      <div class="notice info" style="margin:4px 0 0">${ic("i-info")}<div>Publication counts start at zero and are
        never inferred. Set them yourself — the readiness check and the publication component of every match score
        depend on them.</div></div>
    </div></div>

    <div class="card"><div class="card-h"><h3>Match weights</h3>
      <span class="sub">total ${wsum}${wsum !== 100 ? " — normalised automatically" : ""}</span></div><div class="card-b">
      ${Object.entries(p.weights).map(([k, v]) => `<div class="field">
        <label class="fl">${titleCase(k)} <b class="mono" id="lw_${k}">${v}</b></label>
        <input type="range" min="0" max="60" step="5" value="${v}" data-w="${k}"/></div>`).join("")}
      <div class="sep"></div>
      <div class="field"><label class="fl">Minimum acceptable stipend ≈ USD/mo <b class="mono" id="lminst">${num(p.minStipendUSD)}</b></label>
        <input type="range" min="0" max="8000" step="100" value="${p.minStipendUSD}" data-p2="minStipendUSD"/></div>
      <label class="switch" style="margin-bottom:8px"><input type="checkbox" data-p2b="requireVisa" ${p.requireVisa ? "checked" : ""}/> Visa sponsorship is mandatory for me</label>
      <label class="switch"><input type="checkbox" data-p2b="requireFlight" ${p.requireFlight ? "checked" : ""}/> Flight support is mandatory for me</label>
    </div></div>
  </div>

  <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Research areas</h3>
    <span class="sub">click to toggle · drives the heaviest match component</span></div>
    <div class="card-b">${chipList(p.researchAreas, RESEARCH_AREAS, "researchAreas")}</div></div>

  <div class="grid g-2" style="margin-bottom:16px">
    <div class="card"><div class="card-h"><h3>Software</h3></div><div class="card-b">${chipList(p.software, SOFTWARE, "software")}</div></div>
    <div class="card"><div class="card-h"><h3>Programming languages</h3></div><div class="card-b">${chipList(p.languages, LANGS, "languages")}</div></div>
  </div>

  <div class="grid g-2">
    <div class="card"><div class="card-h"><h3>Appearance</h3></div><div class="card-b">
      <div class="seg"><button data-theme-set="dark" class="${State.ui.theme === "dark" ? "on" : ""}">Dark</button>
        <button data-theme-set="light" class="${State.ui.theme === "light" ? "on" : ""}">Light</button></div>
    </div></div>
    <div class="card"><div class="card-h"><h3>Data & storage</h3></div><div class="card-b">
      <div class="reqrow"><span style="flex:1">Browser storage</span>
        <b style="color:${Store.available ? "var(--ok)" : "var(--amber)"}">${Store.available ? "Available — state persists" : "Unavailable — export before closing"}</b></div>
      <div class="reqrow"><span style="flex:1">Records</span><b>${num(State.opportunities.length)}</b></div>
      <div class="reqrow"><span style="flex:1">Tracked applications</span><b>${num(Object.keys(State.applications).length)}</b></div>
      <div class="reqrow"><span style="flex:1">Schema version</span><b class="mono">${SCHEMA_VERSION}</b></div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <button class="btn btn-sm" id="exportJSON">${ic("i-dl")}Download backup</button>
        <button class="btn btn-sm" data-route="admin">Open Data Manager</button>
      </div>
    </div></div>
  </div>`;
}
</script>
<script>
"use strict";
/* ============================================================================
   ROUTER + EVENT WIRING + BOOT
   ========================================================================== */
function render() {
  const r = State.ui.route;
  const el = $("#page");
  if (!State.opportunities.length && !["admin", "settings", "docs", "sources"].includes(r)) {
    el.innerHTML = emptyDB(ROUTES.flatMap(g => g.items).find(i => i.k === r)?.n || "PRIS");
    return;
  }
  let html = "";
  switch (r) {
    case "dashboard":   html = pageDashboard(); break;
    case "map":         html = pageMap(); break;
    case "explore":     html = pageExplore(null, "Global Opportunities", "Advanced search across the full database"); break;
    case "india":       html = pageExplore(o => o.country === "India", "India", "Positions hosted in India"); break;
    case "fellowships": html = pageExplore(o => /fellowship/i.test(o.fundingType || ""), "Fellowships", "Government, national, international and industry fellowships"); break;
    case "professor":   html = pageProfessor(); break;
    case "saved":       html = pageSaved(); break;
    case "applied":     html = pageApplied(); break;
    case "docs":        html = pageDocs(); break;
    case "analytics":   html = pageAnalytics(); break;
    case "sources":     html = pageSources(); break;
    case "admin":       html = pageAdmin(); break;
    case "settings":    html = pageSettings(); break;
    default:            html = pageDashboard();
  }
  el.innerHTML = html;
  wireMap();
}

/* ------------------------------------------------------------------ map bind */
function wireMap() {
  const host = $("#mapHost"); if (!host) return;
  const tip = $("#mapTip");
  const L = State.opportunities;
  host.addEventListener("mousemove", (e) => {
    const g = e.target.closest(".bub");
    if (!g) { tip.style.display = "none"; return; }
    const c = g.dataset.country;
    const list = L.filter(o => o.country === c);
    const u = list.map(o => toUSD(o.stipendMonthly, o.currency)).filter(v => v != null);
    const rect = host.getBoundingClientRect();
    tip.innerHTML = `<b>${esc(c)}</b>
      <div class="r"><span>Positions</span><span>${num(list.length)}</span></div>
      <div class="r"><span>Open</span><span>${num(list.filter(o => o.status !== "Closed").length)}</span></div>
      <div class="r"><span>Institutions</span><span>${num(uniq(list.map(o => o.university)).length)}</span></div>
      <div class="r"><span>Avg stipend</span><span>${u.length ? "≈$" + num(Math.round(avg(u))) : "—"}</span></div>
      <div class="r"><span>Visa sponsored</span><span>${num(list.filter(o => o.visaSponsorship).length)}</span></div>`;
    tip.style.display = "block";
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    tip.style.left = Math.min(x + 14, rect.width - 175) + "px";
    tip.style.top = Math.max(y - 70, 4) + "px";
  });
  host.addEventListener("mouseleave", () => { tip.style.display = "none"; });
  host.addEventListener("click", (e) => {
    const g = e.target.closest(".bub"); if (!g) return;
    State.ui.mapCountry = State.ui.mapCountry === g.dataset.country ? null : g.dataset.country;
    if (State.ui.route !== "map") { State.ui.route = "map"; renderNav(); }
    render(); window.scrollTo(0, 0);
  });
}

/* -------------------------------------------------------------- autocomplete */
function buildAC(q) {
  if (!q || q.length < 2) return "";
  const t = q.toLowerCase();
  const secs = [];
  const push = (title, items, kind) => { if (items.length) secs.push({ title, items, kind }); };
  push("Opportunities", withComputed(State.opportunities).filter(o => o.title.toLowerCase().includes(t)).slice(0, 6)
    .map(o => ({ t: o.title, s: o.university + " · " + o.country + " · " + o._match + "%", id: o.id })), "opp");
  push("Universities", uniq(State.opportunities.map(o => o.university)).filter(u => u.toLowerCase().includes(t)).slice(0, 4)
    .map(u => ({ t: u, s: State.opportunities.filter(o => o.university === u).length + " positions", q: u })), "q");
  push("Countries", COUNTRIES.map(c => c.n).filter(c => c.toLowerCase().includes(t)).slice(0, 4)
    .map(c => ({ t: c, s: State.opportunities.filter(o => o.country === c).length + " positions", q: c })), "q");
  push("Research areas", RESEARCH_AREAS.filter(a => a.toLowerCase().includes(t)).slice(0, 5)
    .map(a => ({ t: a, s: State.opportunities.filter(o => (o.researchKeywords || []).includes(a)).length + " positions", q: a })), "q");
  if (!secs.length) return `<div class="ac-head">No matches for “${esc(q)}”</div>`;
  return secs.map(s => `<div class="ac-head">${s.title}</div>` + s.items.map(i =>
    `<div class="ac-item" ${i.id ? `data-ac-opp="${i.id}"` : `data-ac-q="${esc(i.q)}"`}>
      <span class="t">${esc(i.t)}</span><span class="s">${esc(i.s)}</span></div>`).join("")).join("");
}

/* ----------------------------------------------------------------- delegation */
function onClick(e) {
  const t = e.target;
  const closest = (sel) => t.closest(sel);

  const rt = closest("[data-route]"); if (rt) { go(rt.dataset.route); return; }

  const fav = closest("[data-fav]");
  if (fav) {
    e.stopPropagation();
    const o = State.opportunities.find(x => x.id === fav.dataset.fav);
    if (o) { o.favourite = !o.favourite; persist(); render(); renderNav();
      if ($("#drawer").classList.contains("on")) openOpportunity(o.id); }
    return;
  }
  const sv = closest("[data-save]");
  if (sv) {
    e.stopPropagation();
    const id = sv.dataset.save;
    setStage(id, stageOf(id) === "saved" ? null : "saved");
    if (!stageOf(id)) delete State.applications[id];
    persist(); render(); buildNotifications(); renderNotifications();
    return;
  }
  const stg = closest("[data-stage]");
  if (stg) {
    const [id, s] = stg.dataset.stage.split("|");
    if (s === "__clear") delete State.applications[id]; else setStage(id, s);
    persist(); openOpportunity(id); render(); renderNav();
    toast(s === "__clear" ? "Removed from pipeline" : "Moved to " + STAGE_META[s].label, "ok");
    return;
  }
  const ed = closest("[data-edit]"); if (ed) { e.stopPropagation(); editRecord(ed.dataset.edit); return; }
  const pi = closest("[data-editpi]"); if (pi) { e.stopPropagation(); editPI(pi.dataset.editpi); return; }
  const sr = closest("[data-saverecord]");
  if (sr) { const [id, isNew] = sr.dataset.saverecord.split("|"); saveRecordFromModal(id, isNew === "1"); return; }
  const spi = closest("[data-savepi]");
  if (spi) {
    const o = State.opportunities.find(x => x.id === spi.dataset.savepi);
    $$("#modalB [data-pi]").forEach(el => { o[el.dataset.pi] = el.value.trim() || null; });
    o.lastVerified = todayISO();
    persist(); closeModal(); render(); toast("PI details recorded", "ok");
    if ($("#drawer").classList.contains("on")) openOpportunity(o.id);
    return;
  }
  const dl = closest("[data-del]");
  if (dl) {
    e.stopPropagation();
    const id = dl.dataset.del;
    const o = State.opportunities.find(x => x.id === id);
    openModal("Delete record", `<p>Delete <b>${esc(o ? o.title : id)}</b>? This cannot be undone from the interface —
      export a backup first if you are unsure.</p>`,
      `<button class="btn" onclick="closeModal()">Cancel</button>
       <button class="btn btn-d" id="confirmDel" data-cd="${id}">Delete</button>`);
    return;
  }
  const cd = closest("[data-cd]");
  if (cd) {
    State.opportunities = State.opportunities.filter(x => x.id !== cd.dataset.cd);
    delete State.applications[cd.dataset.cd];
    persist(); closeModal(); render(); renderNav(); toast("Record deleted", "ok");
    return;
  }
  const sn = closest("[data-savenote]");
  if (sn) {
    const id = sn.dataset.savenote;
    const a = State.applications[id] || { stage: "saved", events: [] };
    a.notes = $("#oppNotes").value; State.applications[id] = a; persist(); toast("Notes saved", "ok"); return;
  }
  const srm = closest("[data-savereminder]");
  if (srm) {
    const id = srm.dataset.savereminder;
    const a = State.applications[id] || { stage: "saved", events: [] };
    a.reminder = $("#oppReminder").value || null; State.applications[id] = a;
    persist(); buildNotifications(); renderNotifications(); toast(a.reminder ? "Reminder set for " + fmtDate(a.reminder) : "Reminder cleared", "ok"); return;
  }
  const so = closest("[data-sort]"); if (so) { State.ui.sort = so.dataset.sort; render(); return; }
  const pg = closest("[data-page]"); if (pg) { State.ui.page = Number(pg.dataset.page); render(); window.scrollTo(0, 0); return; }
  const uc = closest("[data-unchip]");
  if (uc) {
    const k = uc.dataset.unchip, v = uc.dataset.val;
    const f = State.ui.filters;
    if (Array.isArray(f[k])) f[k] = f[k].filter(x => x !== v); else f[k] = false;
    State.ui.page = 1; render(); return;
  }
  const cr = closest("[data-country-row]");
  if (cr) { State.ui.mapCountry = cr.dataset.countryRow; render(); window.scrollTo(0, 0); return; }
  const tg = closest("[data-toggle]");
  if (tg) {
    const [key, val] = tg.dataset.toggle.split("|");
    const arr = State.profile[key];
    const i = arr.indexOf(val);
    if (i >= 0) arr.splice(i, 1); else arr.push(val);
    persist(); render(); return;
  }
  const ts = closest("[data-theme-set]"); if (ts) { setTheme(ts.dataset.themeSet); render(); return; }
  const cal = closest("[data-caldate]");
  if (cal) {
    const d = cal.dataset.caldate;
    const list = withComputed(State.opportunities).filter(o => o.deadline === d);
    openModal("Deadlines on " + fmtDate(d), list.map(o => `<div class="pcard" data-opp="${o.id}" style="margin-bottom:8px">
      <div class="t">${esc(o.title)} ${synBadge(o)}</div><div class="s">${esc(o.university)} · ${esc(o.country)} · match ${o._match}%</div></div>`).join(""));
    return;
  }
  const dr = closest("[data-docready]"); if (dr) return; // handled by change
  const dd = closest("[data-docdel]");
  if (dd) { State.documents = State.documents.filter(d => d.id !== dd.dataset.docdel); persist(); render(); renderNav(); return; }
  const de = closest("[data-doceditid]"); if (de) { editDoc(de.dataset.doceditid); return; }
  const nf = closest("[data-notif]");
  if (nf) {
    const n = State.notifications.find(x => x.id === nf.dataset.notif);
    if (n) { n.read = true; persist(); renderNotifications(); }
    return;
  }
  const acq = closest("[data-ac-q]");
  if (acq) { $("#globalSearch").value = acq.dataset.acQ; State.ui.query = acq.dataset.acQ; $("#acPanel").style.display = "none";
    if (!["explore","india","fellowships"].includes(State.ui.route)) go("explore"); else render(); return; }
  const aco = closest("[data-ac-opp]");
  if (aco) { $("#acPanel").style.display = "none"; openOpportunity(aco.dataset.acOpp); return; }

  const op = closest("[data-opp]");
  if (op) { openOpportunity(op.dataset.opp); return; }

  // buttons by id
  const id = t.closest("button,a") ? (t.closest("button,a").id || "") : "";
  if (id) handleButton(id, e);
}

function handleButton(id, e) {
  switch (id) {
    case "btnTheme": setTheme(State.ui.theme === "dark" ? "light" : "dark"); render(); break;
    case "btnMenu": $("#sidebar").classList.toggle("open"); break;
    case "btnBell": $("#popNotif").classList.toggle("on"); break;
    case "markAllRead": State.notifications.forEach(n => n.read = true); persist(); renderNotifications(); break;
    case "btnProfile": go("settings"); break;
    case "clearFilters": case "clearFilters2":
      State.ui.filters = defaultFilters(); State.ui.query = ""; $("#globalSearch").value = ""; State.ui.page = 1; render(); break;
    case "clearCountry": State.ui.mapCountry = null; render(); break;
    case "exportView": {
      const L = sortList(applyFilters(withComputed(State.opportunities)));
      download("pris_view_" + todayISO() + ".csv", toCSV(L, ["DATA_ORIGIN"]), "text/csv;charset=utf-8");
      toast("Exported " + L.length + " records", "ok"); break;
    }
    case "exportAll":
      download("pris_all_" + todayISO() + ".csv", toCSV(State.opportunities, ["DATA_ORIGIN"]), "text/csv;charset=utf-8");
      toast("Exported " + State.opportunities.length + " records", "ok"); break;
    case "exportApps": {
      const rows = Object.entries(State.applications).map(([oid, a]) => {
        const o = State.opportunities.find(x => x.id === oid) || {};
        return [o.title, o.university, o.country, a.stage, a.appliedOn || "", o.deadline || "", a.reminder || "",
                (a.notes || "").replace(/\n/g, " "), o.synthetic ? "SYNTHETIC-DEMO" : "REAL"].map(csvCell).join(",");
      });
      download("pris_tracker_" + todayISO() + ".csv",
        "title,university,country,stage,appliedOn,deadline,reminder,notes,origin\n" + rows.join("\n"), "text/csv;charset=utf-8");
      toast("Tracker exported", "ok"); break;
    }
    case "exportJSON":
      download("pris_backup_" + todayISO() + ".json", JSON.stringify({
        schema: SCHEMA_VERSION, exportedAt: new Date().toISOString(),
        opportunities: State.opportunities, profile: State.profile,
        documents: State.documents, applications: State.applications
      }, null, 2), "application/json"); toast("Backup downloaded", "ok"); break;
    case "dlTemplate":
      download("pris_import_template.csv", CSV_FIELDS.join(",") + "\n" +
        csvCell("") + "," + csvCell("FALSE") + "," +
        csvCell("Postdoctoral Researcher — Seismic Retrofitting of Steel Frames") + "," +
        csvCell("TU Delft") + ",,,,,"+ csvCell("Netherlands") + "," + csvCell("Delft") +
        ",".repeat(CSV_FIELDS.length - 10) + "\n", "text/csv;charset=utf-8");
      toast("Template downloaded — keep the header row exactly as-is", "ok"); break;
    case "newOpp": editRecord(null); break;
    case "verifyAll":
      State.opportunities.forEach(o => o.lastVerified = todayISO()); persist(); render();
      toast("All records stamped as verified today — only do this if you actually checked them", "ok"); break;
    case "purgeSyn":
      openModal("Purge synthetic records", `<p>Remove all <b>${State.opportunities.filter(o => o.synthetic).length}</b>
        synthetic demo records? Imported and manually created records are untouched.</p>`,
        `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-d" id="doPurge">Purge</button>`); break;
    case "doPurge": {
      const n = State.opportunities.filter(o => o.synthetic).length;
      State.opportunities.filter(o => o.synthetic).forEach(o => delete State.applications[o.id]);
      State.opportunities = State.opportunities.filter(o => !o.synthetic);
      persist(); closeModal(); render(); renderNav(); toast(n + " synthetic records purged", "ok"); break;
    }
    case "restoreSyn":
      openModal("Add synthetic demo records", `
        <div class="notice">${ic("i-warn")}<div><b>These are not real positions.</b> They are generated records used to
        stress-test the interface. They will be badged SYNTHETIC everywhere and stamped SYNTHETIC-DEMO in exports, but
        they will sit alongside your verified data. Only do this if you are testing the app, not job-hunting.</div></div>
        <p class="small muted">You can remove them again with one click.</p>`,
        `<button class="btn" onclick="closeModal()">Cancel</button>
         <button class="btn btn-d" id="doRestoreSyn">Add 120 synthetic records</button>`); break;
    case "doRestoreSyn":
      State.opportunities = State.opportunities.concat(buildSyntheticSet(120));
      recomputeStatus(); persist(); closeModal(); render(); renderNav();
      toast("120 synthetic records added — badged throughout", "ok"); break;
    case "wipeAll":
      openModal("Delete everything", `<p>This removes every record, every tracked application and every document entry.
        Download a backup first if there is anything you want.</p>`,
        `<button class="btn" onclick="closeModal()">Cancel</button>
         <button class="btn" id="exportJSON">Backup first</button>
         <button class="btn btn-d" id="doWipe">Delete everything</button>`); break;
    case "doWipe":
      State.opportunities = []; State.applications = {}; State.notifications = [];
      persist(); closeModal(); render(); renderNav(); toast("Database cleared", "ok"); break;
    case "addDoc": case "addDoc2": editDoc(null); break;
    case "saveDoc": saveDocFromModal(); break;
    case "saveProfile": saveProfileFromPage(); break;
    case "dropzone": $("#filePick").click(); break;
    default: break;
  }
}

/* ------------------------------------------------------------------ documents */
function editDoc(id) {
  const d = id ? State.documents.find(x => x.id === id) : { id: uid("doc"), type: DOC_TYPES[0], label: "", location: "", updated: todayISO(), ready: false };
  if (!d) return;
  openModal(id ? "Edit document" : "Add document", `
    <div class="field"><label class="fl">Type</label><select id="docType">
      ${DOC_TYPES.map(t => `<option ${d.type === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></div>
    <div class="field"><label class="fl">Label (optional)</label><input type="text" id="docLabel" value="${esc(d.label || "")}" placeholder="e.g. Academic CV — 2026 revision"/></div>
    <div class="field"><label class="fl">Where it lives</label><input type="text" id="docLoc" value="${esc(d.location || "")}" placeholder="folder path, cloud link, or a note to yourself"/></div>
    <div class="field"><label class="fl">Last revised</label><input type="date" id="docUpd" value="${esc(d.updated || todayISO())}"/></div>
    <label class="switch"><input type="checkbox" id="docReady" ${d.ready ? "checked" : ""}/> Ready to submit</label>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-p" id="saveDoc">Save</button>`);
  $("#modal").__doc = d; $("#modal").__docNew = !id;
}
function saveDocFromModal() {
  const d = $("#modal").__doc;
  d.type = $("#docType").value; d.label = $("#docLabel").value.trim();
  d.location = $("#docLoc").value.trim(); d.updated = $("#docUpd").value; d.ready = $("#docReady").checked;
  if ($("#modal").__docNew) State.documents.push(d);
  persist(); closeModal(); render(); renderNav(); toast("Document saved", "ok");
}

/* -------------------------------------------------------------------- profile */
function saveProfileFromPage() {
  const p = State.profile;
  $$("[data-p]").forEach(el => { p[el.dataset.p] = el.type === "number" ? Number(el.value) : el.value; });
  $$("[data-pub]").forEach(el => { p.publications[el.dataset.pub] = Number(el.value) || 0; });
  $$("[data-w]").forEach(el => { p.weights[el.dataset.w] = Number(el.value); });
  $$("[data-p2]").forEach(el => { p[el.dataset.p2] = Number(el.value); });
  $$("[data-p2b]").forEach(el => { p[el.dataset.p2b] = el.checked; });
  persist(); render(); toast("Profile saved — match scores recalculated", "ok");
}

/* ---------------------------------------------------------------------- theme */
function setTheme(t) {
  State.ui.theme = t;
  document.documentElement.dataset.theme = t;
  $("#themeIcon").setAttribute("href", t === "dark" ? "#i-moon" : "#i-sun");
  Store.set("theme", t);
}

/* ----------------------------------------------------------------- file input */
function handleFile(file) {
  const rd = new FileReader();
  rd.onload = () => {
    const text = String(rd.result);
    try {
      if (/\.json$/i.test(file.name) || text.trim().startsWith("{")) {
        const j = JSON.parse(text);
        if (j.opportunities) {
          State.opportunities = j.opportunities;
          if (j.profile) State.profile = Object.assign({}, DEFAULT_PROFILE, j.profile);
          if (j.documents) State.documents = j.documents;
          if (j.applications) State.applications = j.applications;
          recomputeStatus(); persist(); render(); renderNav();
          toast("Backup restored — " + j.opportunities.length + " records", "ok");
          return;
        }
        toast("JSON did not contain an 'opportunities' array", "err"); return;
      }
      const raw = text.replace(/\t/g, ",");
      const rows = parseCSV(/\t/.test(text) && !/,/.test(text.split("\n")[0]) ? raw : text);
      const res = importRows(rows);
      render(); renderNav();
      if (res.added) toast(res.added + " records imported" + (res.errors.length ? " · " + res.errors.length + " warnings" : ""), "ok");
      if (res.errors.length) {
        openModal("Import report", `<p><b>${res.added}</b> records imported.</p>
          <p class="muted small">${res.errors.length} warning${res.errors.length === 1 ? "" : "s"}:</p>
          <div class="formula" style="max-height:300px;overflow:auto">${res.errors.slice(0, 200).map(e => `<div class="fr"><span class="fn">${esc(e)}</span></div>`).join("")}</div>`);
      }
    } catch (err) {
      toast("Could not parse that file: " + err.message, "err");
    }
  };
  rd.readAsText(file);
}

/* ------------------------------------------------------------------- boot */
function boot() {
  const savedSchema = Store.get("schema", 0);
  State.ui.theme = Store.get("theme", "dark");
  setTheme(State.ui.theme);
  State.ui.filters = defaultFilters();

  State.profile = Object.assign({}, DEFAULT_PROFILE, Store.get("profile", {}));
  State.profile.weights = Object.assign({}, DEFAULT_PROFILE.weights, State.profile.weights || {});
  State.profile.publications = Object.assign({}, DEFAULT_PROFILE.publications, State.profile.publications || {});
  State.documents = Store.get("docs", DOC_TYPES.slice(0, 4).map(t => ({ id: uid("doc"), type: t, label: "", location: "", updated: null, ready: false })));
  State.applications = Store.get("apps", {});
  State.notifications = Store.get("notifs", []);

  /* ---- data load -------------------------------------------------------
     The build ships with a verified dataset fetched from real sources.
     Precedence:
       1. A newer embedded build than what is in browser storage  → use the build,
          but carry over the user's own manual/imported records and their tracker.
       2. Otherwise                                              → use stored state.
     Synthetic records are NEVER loaded automatically. They exist only if the
     user asks for them explicitly in Data Manager.
     -------------------------------------------------------------------- */
  const LIVE = window.PRIS_LIVE_DATA || null;
  State.dataMeta = LIVE ? { builtAt: LIVE.builtAt, sources: LIVE.sources, counts: LIVE.counts } : null;
  const stored = Store.get("opps", null);
  const storedBuild = Store.get("builtAt", null);

  if (LIVE && (!stored || !stored.length || savedSchema !== SCHEMA_VERSION || storedBuild !== LIVE.builtAt)) {
    // Keep anything the user created or imported themselves; refresh the fetched set.
    const userOwned = (stored && savedSchema === SCHEMA_VERSION)
      ? stored.filter(o => !o.provenance) : [];
    State.opportunities = LIVE.records.concat(userOwned);
    Store.set("builtAt", LIVE.builtAt);
    if (storedBuild && storedBuild !== LIVE.builtAt) {
      setTimeout(() => toast("Refreshed to the " + fmtDate(LIVE.builtAt) + " data pull — " + LIVE.records.length + " verified records", "ok"), 600);
    }
  } else if (stored && stored.length) {
    State.opportunities = stored;
  } else {
    State.opportunities = [];
  }

  recomputeStatus();
  buildNotifications();
  renderNav(); renderNotifications(); render();
  persist();

  if (!Store.available) {
    toast("Browser storage is unavailable here — use Backup JSON in Data Manager before closing the tab", "err");
  }

  /* events */
  document.addEventListener("click", onClick);
  document.addEventListener("click", (e) => {
    if (!e.target.closest("#popNotif") && !e.target.closest("#btnBell")) $("#popNotif").classList.remove("on");
    if (!e.target.closest(".searchbox")) $("#acPanel").style.display = "none";
  });
  $("#scrim").addEventListener("click", () => { closeDrawer(); closeModal(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeDrawer(); closeModal(); $("#popNotif").classList.remove("on"); }
    if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
      e.preventDefault(); $("#globalSearch").focus();
    }
  });

  let acTimer = null;
  $("#globalSearch").addEventListener("input", (e) => {
    const v = e.target.value;
    clearTimeout(acTimer);
    acTimer = setTimeout(() => {
      const html = buildAC(v);
      $("#acPanel").innerHTML = html;
      $("#acPanel").style.display = html ? "block" : "none";
    }, 110);
  });
  $("#globalSearch").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      State.ui.query = e.target.value; State.ui.page = 1;
      $("#acPanel").style.display = "none";
      if (!["explore", "india", "fellowships"].includes(State.ui.route)) go("explore"); else render();
    }
  });

  document.addEventListener("change", (e) => {
    const t = e.target;
    if (t.dataset.fk) {
      const arr = State.ui.filters[t.dataset.fk];
      const i = arr.indexOf(t.value);
      if (t.checked && i < 0) arr.push(t.value);
      if (!t.checked && i >= 0) arr.splice(i, 1);
      State.ui.page = 1; render(); return;
    }
    if (t.dataset.fb) { State.ui.filters[t.dataset.fb] = t.checked; State.ui.page = 1; render(); return; }
    if (t.id === "pageSize") { State.ui.pageSize = Number(t.value); State.ui.page = 1; render(); return; }
    if (t.dataset.docready) {
      const d = State.documents.find(x => x.id === t.dataset.docready);
      if (d) { d.ready = t.checked; persist(); renderNav(); }
      return;
    }
    if (t.id === "filePick" && t.files && t.files[0]) { handleFile(t.files[0]); t.value = ""; return; }
  });

  document.addEventListener("input", (e) => {
    const t = e.target;
    if (t.dataset.fr) {
      const k = t.dataset.fr;
      State.ui.filters[k] = Number(t.value);
      const lbl = { minStipendUSD: "lblStipend", maxRank: "lblRank", minMatch: "lblMatch", deadlineWithin: "lblDl", minDuration: "lblDur" }[k];
      const el = lbl && $("#" + lbl);
      if (el) el.textContent = k === "minStipendUSD" ? num(t.value) : (Number(t.value) || (k === "minMatch" ? 0 : "any"));
      clearTimeout(t.__t); t.__t = setTimeout(() => { State.ui.page = 1; render(); }, 260);
      return;
    }
    if (t.dataset.w) { const el = $("#lw_" + t.dataset.w); if (el) el.textContent = t.value; return; }
    if (t.dataset.p2 === "minStipendUSD") { const el = $("#lminst"); if (el) el.textContent = num(t.value); return; }
    if (t.id === "adminSearch") {
      const q = t.value.toLowerCase();
      const L = q ? State.opportunities.filter(o => haystack(o).includes(q)) : State.opportunities;
      const rows = $("#adminRows"); if (rows) rows.innerHTML = adminRowsHTML(L);
      return;
    }
  });

  // filter group collapse
  document.addEventListener("click", (e) => {
    const h = e.target.closest(".fgroup > h5");
    if (h) h.parentElement.classList.toggle("closed");
  });

  // dropzone
  document.addEventListener("dragover", (e) => { if (e.target.closest("#dropzone")) { e.preventDefault(); e.target.closest("#dropzone").classList.add("over"); } });
  document.addEventListener("dragleave", (e) => { const d = e.target.closest("#dropzone"); if (d) d.classList.remove("over"); });
  document.addEventListener("drop", (e) => {
    const d = e.target.closest("#dropzone");
    if (!d) return;
    e.preventDefault(); d.classList.remove("over");
    if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  window.addEventListener("beforeunload", persist);
}

document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>
