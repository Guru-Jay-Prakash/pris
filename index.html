<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PRIS — Postdoctoral Research Intelligence System</title>
<style>
/* ============================================================
   PRIS — Design tokens
   Dark-first. Light theme via [data-theme="light"] overrides.
   ============================================================ */
:root{
  --bg:#0A0C10;
  --bg-grad:radial-gradient(1200px 700px at 15% -10%, #16202e 0%, transparent 55%),
            radial-gradient(900px 600px at 95% 0%, #1a1626 0%, transparent 50%);
  --panel:#101318;
  --panel-2:#151920;
  --elev:#191E26;
  --glass:rgba(255,255,255,.028);
  --glass-strong:rgba(255,255,255,.05);
  --line:#232935;
  --line-soft:#1c212b;
  --tx:#E7EAF0;
  --tx-2:#9AA4B2;
  --tx-3:#6A7383;
  --acc:#5B8DEF;
  --acc-soft:rgba(91,141,239,.14);
  --teal:#2FB79A;
  --amber:#DFA32B;
  --red:#E5544B;
  --violet:#A78BFA;
  --pink:#E06C9F;
  --ok:#3DBE87;
  --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:22px;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 8px 24px -8px rgba(0,0,0,.55);
  --sh-3:0 24px 60px -20px rgba(0,0,0,.7);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --mono:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  --sidebar-w:248px;
  --topbar-h:60px;
}
[data-theme="light"]{
  --bg:#F5F7FA;
  --bg-grad:radial-gradient(1000px 600px at 10% -10%, #e4ecf8 0%, transparent 55%),
            radial-gradient(800px 500px at 95% 0%, #ece7f7 0%, transparent 50%);
  --panel:#FFFFFF;
  --panel-2:#FAFBFD;
  --elev:#FFFFFF;
  --glass:rgba(15,23,42,.02);
  --glass-strong:rgba(15,23,42,.04);
  --line:#DDE3EC;
  --line-soft:#E9EDF3;
  --tx:#111826;
  --tx-2:#4E5A6B;
  --tx-3:#828E9F;
  --acc:#2C63D4;
  --acc-soft:rgba(44,99,212,.10);
  --teal:#12876E;
  --amber:#9A6A05;
  --red:#C4342B;
  --violet:#6D46D6;
  --pink:#B2477A;
  --ok:#1B8A5A;
  --sh-1:0 1px 2px rgba(16,24,40,.06);
  --sh-2:0 8px 24px -10px rgba(16,24,40,.16);
  --sh-3:0 24px 50px -20px rgba(16,24,40,.22);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;
  color:var(--tx);font-family:var(--sans);
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:3px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:var(--tx-3);background-clip:content-box;border:3px solid transparent;}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px;}
button{font-family:inherit;font-size:inherit;color:inherit;}
a{color:var(--acc);text-decoration:none;}
a:hover{text-decoration:underline;}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.015em;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.tnum{font-variant-numeric:tabular-nums;}

/* ---------- Layout ---------- */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40;
}
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#content{padding:22px 26px 60px;flex:1;min-width:0;}
.page{max-width:1560px;margin:0 auto;}

/* ---------- Sidebar ---------- */
.brand{padding:16px 18px 14px;border-bottom:1px solid var(--line-soft);display:flex;gap:11px;align-items:center;}
.brand-mark{
  width:34px;height:34px;border-radius:10px;flex:0 0 34px;
  background:linear-gradient(140deg,var(--acc),var(--violet));
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:-.5px;
  box-shadow:0 4px 14px -4px rgba(91,141,239,.6);
}
.brand-txt b{display:block;font-size:14px;letter-spacing:-.02em;line-height:1.2;}
.brand-txt span{display:block;font-size:10.5px;color:var(--tx-3);letter-spacing:.04em;text-transform:uppercase;margin-top:1px;}
.nav{padding:12px 10px;overflow-y:auto;flex:1;}
.nav-group{margin-bottom:16px;}
.nav-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx-3);padding:0 10px 7px;font-weight:600;}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 10px;border-radius:var(--r-s);border:0;background:transparent;
  color:var(--tx-2);cursor:pointer;font-size:13.5px;font-weight:500;margin-bottom:1px;
  transition:background .12s,color .12s;
}
.nav-item:hover{background:var(--glass-strong);color:var(--tx);}
.nav-item.active{background:var(--acc-soft);color:var(--acc);font-weight:600;}
.nav-item .ic{width:17px;height:17px;flex:0 0 17px;opacity:.9;}
.nav-item .cnt{margin-left:auto;font-size:11px;color:var(--tx-3);font-variant-numeric:tabular-nums;
  background:var(--glass-strong);padding:1px 6px;border-radius:20px;}
.nav-item.active .cnt{background:rgba(91,141,239,.2);color:var(--acc);}
.side-foot{padding:12px;border-top:1px solid var(--line-soft);font-size:11px;color:var(--tx-3);}

/* ---------- Topbar ---------- */
#topbar{
  height:var(--topbar-h);flex:0 0 var(--topbar-h);
  border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 80%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:35;
}
.mobile-menu{display:none;}
.searchbox{position:relative;flex:1;max-width:560px;}
#topbar .searchbox input[type=text]{
  width:100%;height:36px;border-radius:9px;border:1px solid var(--line);
  background:var(--glass);color:var(--tx);padding:0 42px 0 36px;font-size:13.5px;
  transition:border-color .15s,background .15s;
}
.searchbox input::placeholder{color:var(--tx-3);}
.searchbox input:focus{outline:none;border-color:var(--acc);background:var(--panel-2);}
.searchbox .sic{position:absolute;left:11px;top:9.5px;width:17px;height:17px;color:var(--tx-3);pointer-events:none;}
.searchbox kbd{
  position:absolute;right:9px;top:8px;font-family:var(--mono);font-size:10px;color:var(--tx-3);
  border:1px solid var(--line);border-radius:5px;padding:2px 5px;background:var(--glass);
}
.ac-panel{
  position:absolute;top:42px;left:0;right:0;background:var(--elev);border:1px solid var(--line);
  border-radius:var(--r-m);box-shadow:var(--sh-3);max-height:400px;overflow-y:auto;z-index:60;padding:6px;
}
.ac-item{padding:8px 10px;border-radius:7px;cursor:pointer;display:flex;gap:10px;align-items:center;}
.ac-item:hover,.ac-item.sel{background:var(--acc-soft);}
.ac-item .t{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ac-item .s{font-size:11px;color:var(--tx-3);white-space:nowrap;}
.ac-head{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx-3);padding:8px 10px 4px;font-weight:600;}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:6px;}
.icon-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:transparent;
  display:grid;place-items:center;cursor:pointer;color:var(--tx-2);position:relative;transition:background .12s,color .12s;
}
.icon-btn:hover{background:var(--glass-strong);color:var(--tx);}
.icon-btn .ic{width:18px;height:18px;}
.dot-badge{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red);border:2px solid var(--panel);}
.avatar{
  width:32px;height:32px;border-radius:50%;background:linear-gradient(140deg,var(--teal),var(--acc));
  color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;cursor:pointer;flex:0 0 32px;
}

/* ---------- Panels / cards ---------- */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--sh-1);position:relative;
}
.card.glass{background:linear-gradient(180deg,var(--glass),transparent),var(--panel);}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;}
.card-h h3{font-size:13.5px;letter-spacing:-.01em;}
.card-h .sub{font-size:11.5px;color:var(--tx-3);font-weight:400;}
.card-h .right{margin-left:auto;display:flex;gap:6px;align-items:center;}
.card-b{padding:16px 18px;}
.card-b.tight{padding:10px 12px;}

.grid{display:grid;gap:14px;}
.g-kpi{grid-template-columns:repeat(auto-fill,minmax(196px,1fr));}
.g-2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr));}
.g-3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}

/* ---------- KPI ---------- */
.kpi{
  background:linear-gradient(160deg,var(--glass),transparent),var(--panel);
  border:1px solid var(--line);border-radius:var(--r-l);padding:14px 15px;position:relative;overflow:hidden;
  transition:border-color .15s,transform .15s;
}
.kpi:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--line));}
.kpi .lab{font-size:11px;color:var(--tx-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;
  display:flex;align-items:center;gap:6px;}
.kpi .val{font-size:26px;font-weight:650;letter-spacing:-.03em;margin-top:7px;font-variant-numeric:tabular-nums;line-height:1.1;}
.kpi .val small{font-size:13px;font-weight:500;color:var(--tx-2);letter-spacing:0;}
.kpi .meta{font-size:11.5px;color:var(--tx-3);margin-top:5px;display:flex;gap:6px;align-items:center;}
.kpi .spark{position:absolute;right:0;bottom:0;opacity:.5;pointer-events:none;}
.kpi .icn{position:absolute;top:13px;right:13px;width:16px;height:16px;color:var(--tx-3);opacity:.7;}

/* ---------- Badges / chips ---------- */
.badge{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;
  padding:2.5px 8px;border-radius:20px;letter-spacing:.02em;white-space:nowrap;line-height:1.5;
  border:1px solid transparent;
}
.b-open{background:rgba(61,190,135,.14);color:var(--ok);border-color:rgba(61,190,135,.28);}
.b-soon{background:rgba(223,163,43,.14);color:var(--amber);border-color:rgba(223,163,43,.3);}
.b-closed{background:rgba(229,84,75,.13);color:var(--red);border-color:rgba(229,84,75,.28);}
.b-syn{background:rgba(223,163,43,.16);color:var(--amber);border-color:rgba(223,163,43,.42);}
.b-est{background:rgba(167,139,250,.14);color:var(--violet);border-color:rgba(167,139,250,.32);}
.b-acc{background:var(--acc-soft);color:var(--acc);border-color:color-mix(in srgb,var(--acc) 35%,transparent);}
.b-mut{background:var(--glass-strong);color:var(--tx-2);border-color:var(--line);}
.b-teal{background:rgba(47,183,154,.14);color:var(--teal);border-color:rgba(47,183,154,.3);}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:3px 9px;border-radius:7px;
  background:var(--glass-strong);border:1px solid var(--line);color:var(--tx-2);white-space:nowrap;
}
.chip.on{background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 40%,transparent);color:var(--acc);}
.chip button{border:0;background:none;cursor:pointer;color:inherit;padding:0;display:grid;place-items:center;opacity:.7;}
.chip button:hover{opacity:1;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;height:33px;padding:0 13px;
  border-radius:9px;border:1px solid var(--line);background:var(--glass);color:var(--tx);
  font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,transform .08s;
}
.btn:hover{background:var(--glass-strong);border-color:var(--tx-3);}
.btn:active{transform:translateY(1px);}
.btn .ic{width:15px;height:15px;}
.btn-p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;}
.btn-p:hover{background:color-mix(in srgb,var(--acc) 86%,#fff);border-color:transparent;}
.btn-d{background:transparent;border-color:color-mix(in srgb,var(--red) 45%,transparent);color:var(--red);}
.btn-d:hover{background:rgba(229,84,75,.1);border-color:var(--red);}
.btn-sm{height:27px;padding:0 9px;font-size:12px;border-radius:7px;}
.btn-xs{height:23px;padding:0 7px;font-size:11px;border-radius:6px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.seg{display:inline-flex;background:var(--glass);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px;}
.seg button{border:0;background:transparent;padding:4px 11px;border-radius:7px;font-size:12.5px;color:var(--tx-2);cursor:pointer;font-weight:500;}
.seg button.on{background:var(--elev);color:var(--tx);box-shadow:var(--sh-1);font-weight:600;}

/* ---------- Forms ---------- */
label.fl{display:block;font-size:11px;font-weight:600;color:var(--tx-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=url],input[type=password],select,textarea{
  width:100%;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--glass);
  color:var(--tx);padding:0 10px;font-size:13px;font-family:inherit;transition:border-color .15s;
}
textarea{height:auto;padding:8px 10px;line-height:1.55;resize:vertical;min-height:74px;}
select{cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236A7383' stroke-width='2.2' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center;background-size:14px;padding-right:28px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);background:var(--panel-2);}
input[type=range]{height:auto;padding:0;background:transparent;border:0;accent-color:var(--acc);width:100%;cursor:pointer;}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--acc);cursor:pointer;}
.field{margin-bottom:13px;}
.switch{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px;color:var(--tx-2);user-select:none;}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto;}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
table.tbl th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx-3);
  font-weight:600;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;background:var(--panel);z-index:2;
}
table.tbl td{padding:9px 11px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
table.tbl tbody tr:hover{background:var(--glass);}
table.tbl tbody tr.clickable{cursor:pointer;}

/* ---------- Opportunity rows ---------- */
.opp{
  display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line-soft);cursor:pointer;
  transition:background .12s;align-items:flex-start;
}
.opp:hover{background:var(--glass);}
.opp:last-child{border-bottom:0;}
.opp-main{flex:1;min-width:0;}
.opp-title{font-size:14px;font-weight:600;letter-spacing:-.01em;margin-bottom:3px;line-height:1.35;}
.opp-sub{font-size:12.5px;color:var(--tx-2);margin-bottom:7px;}
.opp-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.opp-side{flex:0 0 138px;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.mscore{
  width:52px;height:52px;border-radius:50%;display:grid;place-items:center;position:relative;flex:0 0 52px;
}
.mscore svg{position:absolute;inset:0;transform:rotate(-90deg);}
.mscore b{font-size:14px;font-weight:700;letter-spacing:-.03em;}
.mscore i{font-size:8.5px;font-style:normal;color:var(--tx-3);text-transform:uppercase;letter-spacing:.06em;display:block;text-align:center;margin-top:-2px;}

/* ---------- Progress bars ---------- */
.pbar{height:6px;border-radius:20px;background:var(--glass-strong);overflow:hidden;}
.pbar>i{display:block;height:100%;border-radius:20px;background:var(--acc);transition:width .4s cubic-bezier(.2,.8,.3,1);}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.bar-row .bl{font-size:12px;color:var(--tx-2);flex:0 0 150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-row .bb{flex:1;}
.bar-row .bv{font-size:12px;font-weight:600;flex:0 0 52px;text-align:right;font-variant-numeric:tabular-nums;}

/* ---------- Drawer / Modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,6,10,.62);backdrop-filter:blur(3px);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;}
.scrim.on{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(880px,94vw);background:var(--panel);
  border-left:1px solid var(--line);box-shadow:var(--sh-3);z-index:90;
  transform:translateX(100%);transition:transform .26s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;
}
.drawer.on{transform:translateX(0);}
.drawer-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;flex-shrink:0;}
.drawer-b{overflow-y:auto;padding:18px 20px 40px;flex:1;}
.drawer-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-shrink:0;background:var(--panel-2);flex-wrap:wrap;}
.modal{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-48%) scale(.98);width:min(820px,94vw);max-height:88vh;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-3);
  z-index:95;display:none;flex-direction:column;opacity:0;transition:opacity .18s,transform .18s;
}
.modal.on{display:flex;opacity:1;transform:translate(-50%,-50%) scale(1);}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
.modal-b{padding:18px 20px;overflow-y:auto;flex:1;}
.modal-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:var(--panel-2);border-radius:0 0 var(--r-xl) var(--r-xl);}

/* ---------- Sections inside detail ---------- */
.dsec{margin-bottom:22px;}
.dsec>h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--tx-3);margin-bottom:9px;font-weight:700;}
.kv{display:grid;grid-template-columns:172px 1fr;gap:7px 14px;font-size:13px;}
.kv dt{color:var(--tx-3);font-size:12px;}
.kv dd{margin:0;color:var(--tx);word-break:break-word;}
.kv dd.na{color:var(--tx-3);font-style:italic;}

/* ---------- Map ---------- */
.mapwrap{position:relative;width:100%;background:
   linear-gradient(180deg,rgba(91,141,239,.04),transparent);border-radius:var(--r-m);overflow:hidden;}
.mapwrap svg{display:block;width:100%;height:auto;}
.bub{cursor:pointer;transition:opacity .15s;}
.bub:hover{opacity:1 !important;}
.map-tip{
  position:absolute;pointer-events:none;background:var(--elev);border:1px solid var(--line);
  border-radius:9px;padding:8px 11px;font-size:12px;box-shadow:var(--sh-2);z-index:10;display:none;min-width:150px;
}
.map-tip b{display:block;font-size:12.5px;margin-bottom:4px;}
.map-tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--tx-2);font-size:11.5px;}
.map-tip .r span:last-child{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums;}

/* ---------- Charts ---------- */
.chart{width:100%;}
.chart text{font-family:var(--sans);}
.axis-l{fill:var(--tx-3);font-size:10px;}
.grid-l{stroke:var(--line-soft);stroke-width:1;}
.legend{display:flex;flex-wrap:wrap;gap:11px;font-size:11.5px;color:var(--tx-2);margin-top:9px;}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px;}

/* ---------- Calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal .dow{font-size:10px;color:var(--tx-3);text-align:center;padding:4px 0;font-weight:600;text-transform:uppercase;}
.cal .d{
  aspect-ratio:1;border-radius:7px;border:1px solid var(--line-soft);padding:4px;font-size:10.5px;
  color:var(--tx-3);position:relative;background:var(--glass);
}
.cal .d.pad{opacity:.25;}
.cal .d.has{border-color:color-mix(in srgb,var(--amber) 45%,transparent);background:rgba(223,163,43,.08);cursor:pointer;}
.cal .d.today{border-color:var(--acc);}
.cal .d .n{position:absolute;bottom:3px;right:4px;font-size:9.5px;font-weight:700;color:var(--amber);}

/* ---------- Pipeline ---------- */
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:11px;}
.pipe-col{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-m);min-height:150px;display:flex;flex-direction:column;}
.pipe-h{padding:9px 11px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;}
.pipe-h .n{margin-left:auto;font-size:11px;color:var(--tx-3);background:var(--glass-strong);padding:1px 6px;border-radius:20px;}
.pipe-b{padding:8px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;max-height:520px;}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer;transition:border-color .12s;}
.pcard:hover{border-color:var(--acc);}
.pcard .t{font-size:12px;font-weight:600;line-height:1.35;margin-bottom:4px;}
.pcard .s{font-size:11px;color:var(--tx-3);}

/* ---------- Misc ---------- */
.hdr{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.hdr h1{font-size:21px;letter-spacing:-.025em;}
.hdr p{margin:3px 0 0;color:var(--tx-2);font-size:13px;}
.hdr .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.notice{
  display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-radius:var(--r-m);
  border:1px solid rgba(223,163,43,.34);background:rgba(223,163,43,.07);font-size:12.5px;color:var(--tx-2);margin-bottom:16px;
}
.notice .ic{width:17px;height:17px;color:var(--amber);flex:0 0 17px;margin-top:1px;}
.notice b{color:var(--amber);}
.notice.info{border-color:color-mix(in srgb,var(--acc) 34%,transparent);background:var(--acc-soft);}
.notice.info .ic{color:var(--acc);}
.notice.info b{color:var(--acc);}
.empty{text-align:center;padding:50px 20px;color:var(--tx-3);}
.empty .ic{width:34px;height:34px;margin:0 auto 12px;opacity:.4;display:block;}
.empty h4{font-size:14px;color:var(--tx-2);margin-bottom:5px;}
.empty p{font-size:12.5px;margin:0 0 14px;}
.sep{height:1px;background:var(--line-soft);margin:16px 0;}
.muted{color:var(--tx-3);}
.small{font-size:11.5px;}
.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{
  background:var(--elev);border:1px solid var(--line);border-radius:10px;padding:10px 15px;font-size:13px;
  box-shadow:var(--sh-3);display:flex;gap:9px;align-items:center;animation:tin .2s ease;max-width:520px;
}
@keyframes tin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.toast svg{width:17px;height:17px;flex:0 0 17px;}
.toast.ok svg{color:var(--ok);} .toast.err svg{color:var(--red);}
.notice svg.ic,.reqrow svg.st,.empty svg.ic{flex-shrink:0;}
.mscore i{letter-spacing:.04em;}
.toast.err{border-color:color-mix(in srgb,var(--red) 50%,transparent);}
.toast.ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent);}
.filters{display:flex;flex-direction:column;gap:0;}
.fgroup{border-bottom:1px solid var(--line-soft);padding:12px 0;}
.fgroup:last-child{border-bottom:0;}
.fgroup>h5{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx-3);margin:0 0 8px;font-weight:700;

<script>
"use strict";
/* ============================================================================
   PRIS — Postdoctoral Research Intelligence System
   Single-file interactive prototype. No external dependencies, no network.

   DATA HONESTY CONTRACT (enforced in code, not just documentation):
   - Every record carries `synthetic: true|false`.
   - Synthetic records render an amber SYNTHETIC badge everywhere they appear,
     and are stamped SYNTHETIC in every CSV/JSON export.
   - Professor emails are NEVER generated. Field is null unless a human enters it.
   - Acceptance rate is NEVER estimated. Null renders as "Not published".
   - Competitiveness is an ESTIMATE from a visible formula; every display of it
     carries an ESTIMATE badge and a clickable input breakdown.
   ========================================================================== */

const PRIS_VERSION = "2.0.0";
const SCHEMA_VERSION = 4;

/* ---------------------------------------------------------------- utilities */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = (p) => (p || "id") + "_" + Math.random().toString(36).slice(2, 10);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const num = (n, d) => (n == null || n === "" || isNaN(n)) ? "—"
  : Number(n).toLocaleString(undefined, { maximumFractionDigits: d == null ? 0 : d });
const ic = (id, cls, sw) => `<svg class="${cls || "ic"}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw || 1.8}" stroke-linecap="round" stroke-linejoin="round"><use href="#${id}"/></svg>`;
const todayISO = () => new Date().toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const fmtDate = (d) => {
  if (!d) return null;
  const dt = new Date(d); if (isNaN(dt)) return null;
  return dt.toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
};
const titleCase = (s) => String(s).replace(/\w\S*/g, t => t[0].toUpperCase() + t.slice(1).toLowerCase());
const uniq = (a) => Array.from(new Set(a));
const sum = (a) => a.reduce((x, y) => x + (Number(y) || 0), 0);
const avg = (a) => a.length ? sum(a) / a.length : 0;
const median = (a) => { if (!a.length) return 0; const s = a.slice().sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

/* Deterministic PRNG so the synthetic set is stable across reloads */
function mulberry(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Storage adapter — degrades silently if storage is unavailable (sandboxed frame) */
const Store = (() => {
  let ok = true;
  try { const k = "__pris_probe"; localStorage.setItem(k, "1"); localStorage.removeItem(k); }
  catch (e) { ok = false; }
  return {
    available: ok,
    get(k, fb) {
      if (!ok) return fb;
      try { const v = localStorage.getItem("pris:" + k); return v == null ? fb : JSON.parse(v); }
      catch (e) { return fb; }
    },
    set(k, v) { if (!ok) return false; try { localStorage.setItem("pris:" + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del(k) { if (!ok) return; try { localStorage.removeItem("pris:" + k); } catch (e) {} }
  };
})();

/* ------------------------------------------------------- reference geography */
/* Country coordinates are approximate centroids used for the projection plot.
   Country / city / currency values are factual; opportunity records attached to
   them may still be synthetic (see the badge). */

function buildSyntheticSet(count) {
  const rnd = mulberry(20260728);

/* ============================================================================

   No black box. Every component score is derived from a set overlap the user
   can inspect in the detail drawer.

/* Domain adjacency: partial credit for related-but-not-identical areas. */
const AREA_KIN = {
  "Earthquake Engineering":["Structural Dynamics","Seismic Retrofitting","Base Isolation & Damping","Performance-Based Design","Soil-Structure Interaction","Resilience & Risk Assessment"],
  "Structural Optimization":["Metaheuristic Optimization","Machine Learning for Structures","Connection Topology","Computational Mechanics"],
  "Steel Structures":["Connection Topology","Composite Structures","Fatigue & Fracture","Bridge Engineering"],
  "Soil-Structure Interaction":["Geotechnical Engineering","Earthquake Engineering","Structural Dynamics"],
  "Structural Dynamics":["Earthquake Engineering","Wind Engineering","Structural Health Monitoring","Blast & Impact Engineering"],
  "Computational Mechanics":["Finite Element Analysis","Structural Optimization","Fatigue & Fracture"],
  "Finite Element Analysis":["Computational Mechanics","Structural Dynamics","Concrete Structures"],
  "Connection Topology":["Steel Structures","Structural Optimization","Fatigue & Fracture"],
  "Metaheuristic Optimization":["Structural Optimization","Machine Learning for Structures"]
};

function setOverlap(userSet, reqSet, kin) {
  const U = new Set(userSet.map(s => String(s).toLowerCase()));
  const R = reqSet.map(s => String(s));
  if (!R.length) return { score: null, hits: [], partial: [], misses: [] };
  const hits = [], partial = [], misses = [];
  let pts = 0;
  R.forEach(r => {
    if (U.has(r.toLowerCase())) { hits.push(r); pts += 1; return; }
    if (kin) {
      const related = (AREA_KIN[r] || []).some(k => U.has(k.toLowerCase()))
        || userSet.some(u => (AREA_KIN[u] || []).some(k => k.toLowerCase() === r.toLowerCase()));
      if (related) { partial.push(r); pts += 0.5; return; }
    }
    misses.push(r);
  });
  return { score: Math.round((pts / R.length) * 100), hits, partial, misses };
}

function computeMatch(o, p) {
  const w = p.weights;
  const research = setOverlap(p.researchAreas, o.researchKeywords || [], true);
  const skills   = setOverlap(p.researchAreas.concat(p.software, p.languages), o.requiredSkills || [], false);
  const software = setOverlap(p.software, o.requiredSoftware || [], false);
  const prog     = setOverlap(p.languages, o.requiredLanguages || [], false);

  // If the posting does not state a publication requirement, this component is
  // SKIPPED entirely. Awarding 100% for an unstated requirement would inflate
  // every score on scraped data, where most requirement fields are absent.
  const need = o.requiredPublications;
  const have = (p.publications.journal || 0) + (p.publications.conference || 0);
  const pubs = (need == null) ? null : (need === 0 ? 100 : Math.round(clamp(have / need, 0, 1) * 100));

  const parts = [
    { key: "research",     label: "Research area",   w: w.research,     v: research.score,  d: research },
    { key: "skills",       label: "Required skills", w: w.skills,       v: skills.score,    d: skills },
    { key: "software",     label: "Software",        w: w.software,     v: software.score,  d: software },
    { key: "programming",  label: "Programming",     w: w.programming,  v: prog.score,      d: prog },
    { key: "publications", label: "Publications",    w: w.publications, v: pubs,            d: { need, have } }
  ];
  const active = parts.filter(x => x.v != null);
  const wsum = sum(active.map(x => x.w)) || 1;
  const overall = active.length ? Math.round(sum(active.map(x => x.v * x.w)) / wsum) : null;

  // How much of your weighting the posting actually gave us something to score on.
  const coverage = Math.round((wsum / (sum(Object.values(w)) || 1)) * 100);

  const blockers = [];
  if (o.status === "Closed") blockers.push("Deadline has passed");
  if (o.citizenshipRestriction) blockers.push("Citizenship restriction: " + o.citizenshipRestriction);
  if (p.requireVisa && o.visaSponsorship === false) blockers.push("Posting states no visa sponsorship, and you require it");
  if (p.requireFlight && o.flightTicket === false) blockers.push("Posting states no flight support, and you require it");
  const usd = toUSD(o.stipendMonthly, o.currency);
  if (p.minStipendUSD && usd != null && usd < p.minStipendUSD) blockers.push("Stipend ≈ USD " + num(usd) + "/mo is below your floor of USD " + num(p.minStipendUSD));

  return { overall, parts, blockers, coverage, scoredOn: active.length };
}

/* ============================================================================
   COMPETITIVENESS ESTIMATE — an ESTIMATE, never a measurement.
   Inputs are all visible. Output is always badged. Official acceptance rate is
   shown instead whenever one exists; this estimate is then suppressed.
   ========================================================================== */
function competitiveness(o) {
  const f = [];
  let score = 0, wsum = 0, realInputs = 0;
  const add = (name, weight, value, note, isReal) => {
    f.push({ name, weight, value, note, real: !!isReal });
    score += value * weight; wsum += weight;
    if (isReal) realInputs++;
  };

  // 1. Institutional visibility — better-ranked institutions attract more applicants
  const rank = o.qsRank || o.theRank;
  if (rank != null) {
    // Log decay: rank 1 → 100, rank 10 → 83, rank 100 → 61, rank 500 → 46, rank 1000 → 39.
    const v = clamp(105 - 22 * Math.log10(clamp(rank, 1, 2000)), 0, 100);
    add("Institutional ranking", 0.30, Math.round(v), "rank " + rank + " → better-ranked institutions draw larger applicant pools", true);
  } else {
    add("Institutional ranking", 0.30, 45, "NOT ON FILE — neutral 45 assumed, contributes nothing real", false);
  }
  // 2. Funding attractiveness
  const usd = toUSD(o.stipendMonthly, o.currency);
  if (usd != null) {
    const v = clamp((usd - 1200) / (8000 - 1200) * 100, 0, 100);
    add("Stipend attractiveness", 0.22, Math.round(v), "≈ USD " + num(usd) + "/mo relative to a 1.2k–8k band", true);
  } else add("Stipend attractiveness", 0.22, 50, "NOT ON FILE — neutral 50 assumed", false);

  // 3. Field breadth — broad calls attract more applicants than narrow ones
  const nk = (o.researchKeywords || []).length;
  if (nk) add("Field breadth", 0.16, clamp(Math.round(30 + nk * 18), 0, 100),
    nk + " keyword" + (nk === 1 ? "" : "s") + " matched in the title → broader calls draw wider pools", true);
  else add("Field breadth", 0.16, 50, "no keywords matched in the title — neutral 50 assumed", false);

  // 4. Barriers reduce the applicant pool. Only counted where the posting
  //    actually stated something; absence of a field is not evidence of absence.
  const known = [o.citizenshipRestriction != null, o.ageRestriction != null,
                 o.requiredPublications != null, o.visaSponsorship != null].filter(Boolean).length;
  if (known) {
    let barrier = 100;
    if (o.citizenshipRestriction) barrier -= 40;
    if (o.ageRestriction) barrier -= 12;
    if ((o.requiredPublications || 0) >= 4) barrier -= 18;
    if (o.visaSponsorship === false) barrier -= 14;
    add("Openness (fewer barriers = more applicants)", 0.18, clamp(Math.round(barrier), 0, 100),
      [o.citizenshipRestriction ? "citizenship limit" : null, o.ageRestriction ? "age limit" : null,
       (o.requiredPublications || 0) >= 4 ? "high publication bar" : null,
       o.visaSponsorship === false ? "no visa sponsorship" : null].filter(Boolean).join(", ") || "no restrictions stated", true);
  } else add("Openness (fewer barriers = more applicants)", 0.18, 100, "NO ELIGIBILITY FIELDS ON FILE — cannot assess", false);

  // 5. Window length — longer open windows accumulate more applications
  const win = (o.deadline && o.postedDate) ? clamp(daysBetween(o.postedDate, o.deadline), 0, 240) : null;
  if (win != null) add("Application window", 0.14, Math.round(clamp(win / 240 * 100, 0, 100)), win + " days open → longer windows accumulate applicants", true);
  else add("Application window", 0.14, 50, "NOT ON FILE — posted date or deadline missing", false);

  const final = Math.round(score / wsum);
  const band = final >= 75 ? "Very high" : final >= 60 ? "High" : final >= 45 ? "Moderate" : final >= 30 ? "Lower" : "Low";
  // Fewer than two real inputs means the number would be almost entirely
  // composed of my own neutral assumptions. Suppress it rather than show it.
  const sufficient = realInputs >= 2;
  return { score: final, band, factors: f, isEstimate: true, realInputs, sufficient };
}

/* ============================================================================
   BOOLEAN / FULL-TEXT SEARCH
   Supports: bare terms (AND), OR, NOT / -term, "quoted phrases", field:value
   ========================================================================== */
function haystack(o) {
  return [o.title, o.university, o.department, o.laboratory, o.researchGroup, o.country, o.city,
          o.fundingAgency, o.fundingType, o.researchArea, (o.researchKeywords || []).join(" "),
          (o.requiredSoftware || []).join(" "), (o.requiredLanguages || []).join(" "),
          (o.requiredSkills || []).join(" "), o.description, o.professorLabel, o.professorName]
    .filter(Boolean).join(" ").toLowerCase();
}
function parseQuery(q) {
  const toks = []; const re = /"([^"]+)"|(\S+)/g; let m;
  while ((m = re.exec(q))) toks.push(m[1] != null ? { phrase: m[1] } : { word: m[2] });
  const groups = []; let cur = { must: [], not: [], any: [] }; let pendingOr = false;
  toks.forEach(t => {
    const raw = (t.phrase != null ? t.phrase : t.word);
    const up = raw.toUpperCase();
    if (up === "AND") return;
    if (up === "OR") { pendingOr = true; return; }
    if (up === "NOT") { cur._neg = true; return; }
    let term = raw, neg = false;
    if (cur._neg) { neg = true; cur._neg = false; }
    if (term.startsWith("-") && term.length > 1) { neg = true; term = term.slice(1); }
    const item = term.toLowerCase();
    if (neg) cur.not.push(item);
    else if (pendingOr) { const last = cur.must.pop(); cur.any.push([last, item].filter(Boolean)); pendingOr = false; }
    else cur.must.push(item);

}
function matchesQuery(o, q) {
  if (!q || !q.trim()) return true;
  const h = haystack(o);
  const p = parseQuery(q.trim());
  for (const t of p.must) { if (!h.includes(t)) return false; }
  for (const t of p.not) { if (h.includes(t)) return false; }
  for (const grp of p.any) { if (!grp.some(t => h.includes(t))) return false; }
  return true;
}

/* ============================================================================
   READINESS / CHECKLIST ENGINE (replaces auto-generated application text)
   ========================================================================== */
function readiness(o) {
  const req = o.requiredDocuments || [];
  const have = new Set(State.documents.filter(d => d.ready).map(d => d.type));
  const rows = req.map(r => ({ doc: r, ok: have.has(r) }));
  const p = State.profile;
  const gates = [
    { label: "Deadline still open", ok: o.status !== "Closed",
      detail: o.status === "Closed" ? "Closed on " + (fmtDate(o.deadline) || "unknown date") : (o.deadline ? daysBetween(todayISO(), o.deadline) + " days remaining" : "no deadline on file") },
    { label: "No citizenship barrier", ok: !o.citizenshipRestriction, detail: o.citizenshipRestriction || "none recorded" },
    { label: "Publication threshold met", ok: (p.publications.journal + p.publications.conference) >= (o.requiredPublications || 0),
      detail: "requires " + (o.requiredPublications || 0) + ", profile lists " + (p.publications.journal + p.publications.conference) },
    { label: "Software overlap", ok: (o.requiredSoftware || []).some(s => p.software.includes(s)) || !(o.requiredSoftware || []).length,
      detail: (o.requiredSoftware || []).join(", ") || "none specified" },
    { label: "Visa route viable", ok: o.visaSponsorship || o.country === p.nationality,
      detail: o.visaSponsorship ? "sponsorship offered" : (o.country === p.nationality ? "home country" : "no sponsorship recorded — verify on the posting") }
  ];
  const docOk = rows.filter(r => r.ok).length;
  const gateOk = gates.filter(g => g.ok).length;
  const pct = req.length + gates.length === 0 ? 0
    : Math.round(((docOk + gateOk) / (req.length + gates.length)) * 100);
  return { rows, gates, pct, missing: rows.filter(r => !r.ok).map(r => r.doc) };
}

/* Duplicate detection — same institution + high title similarity */
function tokenSet(s) { return new Set(String(s).toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(w => w.length > 3)); }
function jaccard(a, b) { const i = [...a].filter(x => b.has(x)).length; const u = new Set([...a, ...b]).size; return u ? i / u : 0; }
function findDuplicates(list) {
  const byUni = {};
  list.forEach(o => { (byUni[o.university] = byUni[o.university] || []).push(o); });
  const pairs = [];
  Object.values(byUni).forEach(g => {
    for (let i = 0; i < g.length; i++) for (let j = i + 1; j < g.length; j++) {
      const s = jaccard(tokenSet(g[i].title), tokenSet(g[j].title));
      if (s >= 0.6) pairs.push({ a: g[i], b: g[j], sim: Math.round(s * 100) });
    }
  });
  return pairs.sort((x, y) => y.sim - x.sim);
}

/* Related opportunities — keyword + country proximity */
function relatedTo(o, n) {
  const ks = tokenSet((o.researchKeywords || []).join(" ") + " " + o.title);
  return State.opportunities.filter(x => x.id !== o.id)
    .map(x => ({ o: x, s: jaccard(ks, tokenSet((x.researchKeywords || []).join(" ") + " " + x.title)) + (x.country === o.country ? 0.08 : 0) }))
    .sort((a, b) => b.s - a.s).slice(0, n || 5).filter(x => x.s > 0.05).map(x => x.o);
}
</script>
<script>
"use strict";
/* ============================================================================
   CHART PRIMITIVES — hand-rolled SVG, no dependencies, theme-aware.
   Categorical palette is capped at 6 hues; beyond that series are grouped into
   "Other" rather than rendered in indistinguishable colours.
   ========================================================================== */
const CAT = ["#5B8DEF","#2FB79A","#DFA32B","#A78BFA","#E06C9F","#6BA8B5"];
const SEQ = ["#16223a","#1d3560","#28508e","#3670c4","#5B8DEF","#8FB4F5","#C2D6FA"];

function seqColor(t) { // t in 0..1
  const i = clamp(Math.round(t * (SEQ.length - 1)), 0, SEQ.length - 1);
  return SEQ[i];
}
function svgEl(w, h, cls) {
  return { w, h, parts: [], cls: cls || "chart",
    out() { return `<svg class="${this.cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img">${this.parts.join("")}</svg>`; } };
}

/* Horizontal bar chart with direct value labels */
function barChartH(data, opts) {
  opts = opts || {};
  const rowH = opts.rowH || 26, pad = { l: opts.labelW || 150, r: 52, t: 6, b: 6 };
  const h = pad.t + pad.b + data.length * rowH;
  const w = 640;
  const max = Math.max(1, ...data.map(d => d.v));
  const bw = w - pad.l - pad.r;
  const s = svgEl(w, Math.max(h, 40));
  data.forEach((d, i) => {
    const y = pad.t + i * rowH;
    const len = (d.v / max) * bw;
    const col = d.color || (opts.seq ? seqColor(d.v / max) : CAT[0]);
    s.parts.push(`<text x="${pad.l - 8}" y="${y + rowH / 2 + 4}" text-anchor="end" class="axis-l" style="font-size:11.5px;fill:var(--tx-2)">${esc(d.k.length > 26 ? d.k.slice(0, 25) + "…" : d.k)}</text>`);
    s.parts.push(`<rect x="${pad.l}" y="${y + 5}" width="${bw}" height="${rowH - 12}" rx="3" fill="var(--glass-strong)"/>`);
    s.parts.push(`<rect x="${pad.l}" y="${y + 5}" width="${Math.max(2, len)}" height="${rowH - 12}" rx="3" fill="${col}"><title>${esc(d.k)}: ${esc(d.label || num(d.v))}</title></rect>`);
    s.parts.push(`<text x="${pad.l + bw + 6}" y="${y + rowH / 2 + 4}" class="axis-l" style="font-size:11.5px;fill:var(--tx);font-weight:600">${esc(d.label || num(d.v))}</text>`);
  });
  return s.out();
}

/* Vertical column chart with x labels */
function colChart(data, opts) {
  opts = opts || {};
  const w = 640, h = opts.h || 210, pad = { l: 40, r: 10, t: 12, b: 34 };
  const max = Math.max(1, ...data.map(d => d.v));
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const bw = iw / data.length;
  const s = svgEl(w, h);
  for (let g = 0; g <= 4; g++) {
    const y = pad.t + ih - (ih * g / 4);
    s.parts.push(`<line x1="${pad.l}" y1="${y}" x2="${w - pad.r}" y2="${y}" class="grid-l"/>`);
    s.parts.push(`<text x="${pad.l - 6}" y="${y + 3.5}" text-anchor="end" class="axis-l">${num(max * g / 4)}</text>`);
  }
  data.forEach((d, i) => {
    const bh = (d.v / max) * ih;
    const x = pad.l + i * bw + bw * 0.18;
    const col = d.color || CAT[0];
    s.parts.push(`<rect x="${x}" y="${pad.t + ih - bh}" width="${bw * 0.64}" height="${Math.max(1, bh)}" rx="3" fill="${col}"><title>${esc(d.k)}: ${esc(d.label || num(d.v))}</title></rect>`);
    if (data.length <= 16 || i % 2 === 0)
      s.parts.push(`<text x="${pad.l + i * bw + bw / 2}" y="${h - 12}" text-anchor="middle" class="axis-l">${esc(d.short || d.k)}</text>`);
  });
  return s.out();
}

/* Line / area trend */
function lineChart(data, opts) {
  opts = opts || {};
  const w = 640, h = opts.h || 200, pad = { l: 40, r: 12, t: 12, b: 28 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const max = Math.max(1, ...data.map(d => d.v));
  const px = (i) => pad.l + (data.length === 1 ? iw / 2 : (i / (data.length - 1)) * iw);
  const py = (v) => pad.t + ih - (v / max) * ih;
  const s = svgEl(w, h);
  for (let g = 0; g <= 4; g++) {
    const y = pad.t + ih - (ih * g / 4);
    s.parts.push(`<line x1="${pad.l}" y1="${y}" x2="${w - pad.r}" y2="${y}" class="grid-l"/>`);
    s.parts.push(`<text x="${pad.l - 6}" y="${y + 3.5}" text-anchor="end" class="axis-l">${num(max * g / 4)}</text>`);
  }
  const pts = data.map((d, i) => `${px(i)},${py(d.v)}`).join(" ");
  s.parts.push(`<polyline points="${pad.l},${pad.t + ih} ${pts} ${px(data.length - 1)},${pad.t + ih}" fill="${opts.color || CAT[0]}" opacity=".13"/>`);
  s.parts.push(`<polyline points="${pts}" fill="none" stroke="${opts.color || CAT[0]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`);
  data.forEach((d, i) => {
    s.parts.push(`<circle cx="${px(i)}" cy="${py(d.v)}" r="3" fill="var(--panel)" stroke="${opts.color || CAT[0]}" stroke-width="2"><title>${esc(d.k)}: ${num(d.v)}</title></circle>`);
    if (data.length <= 14 || i % Math.ceil(data.length / 10) === 0)
      s.parts.push(`<text x="${px(i)}" y="${h - 9}" text-anchor="middle" class="axis-l">${esc(d.short || d.k)}</text>`);
  });
  return s.out();
}

/* Donut with centre total */
function donut(data, opts) {
  opts = opts || {};
  const size = 190, r = 74, rin = 50, cx = size / 2, cy = size / 2;
  const total = sum(data.map(d => d.v)) || 1;
  let a0 = -Math.PI / 2;
  const s = svgEl(size, size);
  data.forEach((d, i) => {
    const frac = d.v / total, a1 = a0 + frac * Math.PI * 2;
    const large = frac > 0.5 ? 1 : 0;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const xi1 = cx + rin * Math.cos(a1), yi1 = cy + rin * Math.sin(a1);
    const xi0 = cx + rin * Math.cos(a0), yi0 = cy + rin * Math.sin(a0);
    const col = d.color || CAT[i % CAT.length];
    if (frac > 0.9995) {
      s.parts.push(`<circle cx="${cx}" cy="${cy}" r="${(r + rin) / 2}" fill="none" stroke="${col}" stroke-width="${r - rin}"><title>${esc(d.k)}: ${num(d.v)}</title></circle>`);
    } else {
      s.parts.push(`<path d="M${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1} L${xi1},${yi1} A${rin},${rin} 0 ${large} 0 ${xi0},${yi0} Z" fill="${col}" stroke="var(--panel)" stroke-width="1.5"><title>${esc(d.k)}: ${num(d.v)} (${Math.round(frac * 100)}%)</title></path>`);
    }
    a0 = a1;
  });
  s.parts.push(`<text x="${cx}" y="${cy - 2}" text-anchor="middle" style="font-size:22px;font-weight:700;fill:var(--tx)">${num(total)}</text>`);
  s.parts.push(`<text x="${cx}" y="${cy + 15}" text-anchor="middle" style="font-size:10px;fill:var(--tx-3);text-transform:uppercase;letter-spacing:.07em">${esc(opts.centre || "total")}</text>`);
  return s.out();
}

function legendHTML(data) {
  return `<div class="legend">${data.map((d, i) =>
    `<span><i style="background:${d.color || CAT[i % CAT.length]}"></i>${esc(d.k)} <b class="tnum" style="color:var(--tx)">${num(d.v)}</b></span>`).join("")}</div>`;
}

function sparkline(vals, w, h, color) {
  w = w || 90; h = h || 30;
  const max = Math.max(1, ...vals), min = Math.min(...vals);
  const rng = (max - min) || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1 || 1)) * w},${h - ((v - min) / rng) * (h - 4) - 2}`).join(" ");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${color || "var(--acc)"}" stroke-width="1.6" stroke-linejoin="round" opacity=".85"/></svg>`;
}

/* ============================================================================
   GEOGRAPHIC PLOT
   ----------------------------------------------------------------------------
   This is an equirectangular projection plot, NOT a political boundary map.
   Countries are placed at their approximate centroid latitude/longitude and
   sized by opportunity count. Deliberately not a filled choropleth: I do not
   have verified boundary geometry available offline, and drawing an
   approximated outline would misrepresent borders.
   ========================================================================== */
function geoPlot(rows, opts) {
  opts = opts || {};
  const W = 1000, H = 500;
  const proj = (lat, lon) => [ (lon + 180) / 360 * W, (90 - lat) / 180 * H ];
  const max = Math.max(1, ...rows.map(r => r.count));
  const s = [];

  s.push(`<rect x="0" y="0" width="${W}" height="${H}" rx="10" fill="var(--glass)"/>`);
  // graticule
  for (let lon = -180; lon <= 180; lon += 30) {
    const [x] = proj(0, lon);
    s.push(`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--line-soft)" stroke-width="1"/>`);
  }
  for (let lat = -60; lat <= 60; lat += 30) {
    const [, y] = proj(lat, 0);
    s.push(`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--line-soft)" stroke-width="1"/>`);
  }
  const [, eq] = proj(0, 0);
  s.push(`<line x1="0" y1="${eq}" x2="${W}" y2="${eq}" stroke="var(--line)" stroke-width="1.2" stroke-dasharray="5 5"/>`);
  s.push(`<text x="8" y="${eq - 6}" style="font-size:9.5px;fill:var(--tx-3)">Equator</text>`);

  // region labels at approximate positions
  const regions = [["N. America",45,-100],["S. America",-15,-60],["Europe",54,15],["Africa",5,20],["Asia",42,90],["Oceania",-25,140],["M. East",28,45]];
  regions.forEach(([nm, la, lo]) => {
    const [x, y] = proj(la, lo);
    s.push(`<text x="${x}" y="${y}" text-anchor="middle" style="font-size:10px;fill:var(--tx-3);letter-spacing:.1em;text-transform:uppercase;opacity:.55;font-weight:600">${nm}</text>`);
  });

  rows.slice().sort((a, b) => b.count - a.count).forEach(r => {
    const meta = CBY[r.country]; if (!meta) return;
    const [x, y] = proj(meta.lat, meta.lon);
    const rad = 5 + Math.sqrt(r.count / max) * 26;
    const t = r.avgUSD == null ? 0.5 : clamp((r.avgUSD - 800) / (7000 - 800), 0, 1);
    const col = seqColor(t);
    const sel = opts.selected === r.country;
    s.push(`<g class="bub" data-country="${esc(r.country)}" opacity="${sel ? 1 : .82}">
      <circle cx="${x}" cy="${y}" r="${rad}" fill="${col}" fill-opacity="${sel ? .95 : .62}" stroke="${sel ? "var(--tx)" : col}" stroke-width="${sel ? 2 : 1.2}"/>
      ${rad > 15 ? `<text x="${x}" y="${y + 4}" text-anchor="middle" style="font-size:11px;font-weight:700;fill:#08101f;pointer-events:none">${r.count}</text>` : ""}
    </g>`);
  });

  // legend
  s.push(`<g transform="translate(16,${H - 54})">
    <text x="0" y="0" style="font-size:9.5px;fill:var(--tx-3);text-transform:uppercase;letter-spacing:.08em;font-weight:600">Bubble size = positions · colour ≈ avg stipend (USD)</text>
    ${SEQ.map((c, i) => `<rect x="${i * 22}" y="8" width="20" height="8" rx="2" fill="${c}"/>`).join("")}
    <text x="0" y="30" style="font-size:9.5px;fill:var(--tx-3)">low</text>
    <text x="${SEQ.length * 22 - 8}" y="30" style="font-size:9.5px;fill:var(--tx-3)">high</text>
  </g>`);

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${s.join("")}</svg>`;
}

/* Deadline calendar for a given month */
function calendarHTML(year, month, byDate) {
  const first = new Date(Date.UTC(year, month, 1));
  const startDow = (first.getUTCDay() + 6) % 7; // Monday-first
  const days = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
  const prevDays = new Date(Date.UTC(year, month, 0)).getUTCDate();
  const today = todayISO();
  let h = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => `<div class="dow">${d}</div>`).join("");
  for (let i = startDow - 1; i >= 0; i--) h += `<div class="d pad">${prevDays - i}</div>`;
  for (let d = 1; d <= days; d++) {
    const iso = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const n = (byDate[iso] || []).length;
    h += `<div class="d ${n ? "has" : ""} ${iso === today ? "today" : ""}" ${n ? `data-caldate="${iso}"` : ""} title="${n ? n + " deadline(s) on " + iso : iso}">${d}${n ? `<span class="n">${n}</span>` : ""}</div>`;
  }
  const tail = (7 - ((startDow + days) % 7)) % 7;
  for (let i = 1; i <= tail; i++) h += `<div class="d pad">${i}</div>`;
  return `<div class="cal">${h}</div>`;
}

/* Radial match score ring */
function matchRing(v, size) {
  size = size || 52;
  const r = size / 2 - 4, c = 2 * Math.PI * r;
  const col = v >= 75 ? "var(--ok)" : v >= 55 ? "var(--acc)" : v >= 35 ? "var(--amber)" : "var(--tx-3)";
  return `<div class="mscore" style="width:${size}px;height:${size}px;flex-basis:${size}px">
    <svg viewBox="0 0 ${size} ${size}">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--glass-strong)" stroke-width="4"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - v / 100)}"/>
    </svg>
    <div style="text-align:center;line-height:1"><b style="color:${col}">${v}</b><i>match</i></div>
  </div>`;
}

<script>
"use strict";
/* ============================================================================
   APP SHELL — persistence, routing, notifications, drawer/modal, toasts
   ========================================================================== */

function persist() {
  Store.set("schema", SCHEMA_VERSION);
  Store.set("opps", State.opportunities);
  Store.set("profile", State.profile);
  Store.set("docs", State.documents);
  Store.set("apps", State.applications);
  Store.set("notifs", State.notifications.slice(0, 80));
  Store.set("theme", State.ui.theme);
}
function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.innerHTML = (kind === "err" ? ic("i-warn") : kind === "ok" ? ic("i-check") : ic("i-info")) + "<span>" + esc(msg) + "</span>";
  $("#toasts").appendChild(el);
  setTimeout(() => { el.style.opacity = "0"; el.style.transition = "opacity .3s"; setTimeout(() => el.remove(), 320); }, 3200);
}

/* ---------------------------------------------------------------- drawer */
let drawerCloser = null;
function openDrawer(headHTML, bodyHTML, footHTML, onClose) {
  $("#drawerH").innerHTML = headHTML;
  $("#drawerB").innerHTML = bodyHTML;
  $("#drawerF").innerHTML = footHTML || "";
  $("#drawer").classList.add("on"); $("#scrim").classList.add("on");
  $("#drawerB").scrollTop = 0;
  drawerCloser = onClose || null;
}
function closeDrawer() {
  $("#drawer").classList.remove("on");
  if (!$("#modal").classList.contains("on")) $("#scrim").classList.remove("on");
  if (drawerCloser) { const f = drawerCloser; drawerCloser = null; f(); }
}
function openModal(title, bodyHTML, footHTML) {
  $("#modalH").innerHTML = `<h3 style="font-size:14.5px;flex:1">${title}</h3>
    <button class="icon-btn" onclick="closeModal()" aria-label="Close">${ic("i-x")}</button>`;
  $("#modalB").innerHTML = bodyHTML;
  $("#modalF").innerHTML = footHTML || `<button class="btn" onclick="closeModal()">Close</button>`;
  $("#modal").classList.add("on"); $("#scrim").classList.add("on");
}
function closeModal() {
  $("#modal").classList.remove("on");
  if (!$("#drawer").classList.contains("on")) $("#scrim").classList.remove("on");
}

/* ------------------------------------------------------------ derived data */
function withComputed(list) {
  const p = State.profile;
  return list.map(o => {
    const m = computeMatch(o, p);
    return Object.assign({}, o, { _match: m.overall, _m: m, _app: State.applications[o.id] || null });
  });
}
function recomputeStatus() {
  const t = todayISO();
  State.opportunities.forEach(o => {
    if (!o.deadline) { o.status = o.status || "Open"; return; }
    const d = daysBetween(t, o.deadline);
    o.status = d < 0 ? "Closed" : d <= 21 ? "Closing Soon" : "Open";
  });
}
function countBy(list, fn) {
  const m = {}; list.forEach(o => { const k = fn(o); if (k == null) return; m[k] = (m[k] || 0) + 1; });
  return Object.entries(m).map(([k, v]) => ({ k, v })).sort((a, b) => b.v - a.v);
}
function stageOf(id) { const a = State.applications[id]; return a ? a.stage : null; }
function setStage(id, stage, note) {
  const now = new Date().toISOString();
  const cur = State.applications[id] || { stage: null, notes: "", events: [], reminder: null };
  if (cur.stage !== stage) cur.events = (cur.events || []).concat([{ stage, at: now, note: note || "" }]);
  cur.stage = stage;
  if (stage === "applied" && !cur.appliedOn) cur.appliedOn = todayISO();
  State.applications[id] = cur;
  persist(); renderNav();
}

/* ------------------------------------------------------------ notifications */
function buildNotifications() {
  const t = todayISO();
  const existing = new Set(State.notifications.map(n => n.key));
  const add = (key, type, title, desc) => {
    if (existing.has(key)) return;
    State.notifications.unshift({ id: uid("n"), key, type, title, desc, at: new Date().toISOString(), read: false });
  };
  State.opportunities.forEach(o => {
    if (!o.deadline) return;
    const d = daysBetween(t, o.deadline);
    const st = stageOf(o.id);
    if (d >= 0 && d <= 7 && (st === "saved" || o.favourite))
      add("dl7:" + o.id, "deadline", "Deadline in " + d + " day" + (d === 1 ? "" : "s"), o.title + " — " + o.university);
    else if (d >= 0 && d <= 21 && st === "saved")
      add("dl21:" + o.id, "deadline", "Closing soon (" + d + " days)", o.title + " — " + o.university);
  });
  const fresh = State.opportunities.filter(o => o.createdAt === t);
  if (fresh.length) add("new:" + t, "new", fresh.length + " new opportunit" + (fresh.length === 1 ? "y" : "ies") + " added today", "Added " + fmtDate(t));
  Object.entries(State.applications).forEach(([id, a]) => {
    if (a.reminder && a.reminder <= t) {
      const o = State.opportunities.find(x => x.id === id);
      if (o) add("rem:" + id + ":" + a.reminder, "reminder", "Reminder due", o.title);
    }
  });
  State.notifications = State.notifications.slice(0, 80);
}
function renderNotifications() {
  const list = State.notifications;
  const unread = list.filter(n => !n.read).length;
  $("#bellDot").style.display = unread ? "block" : "none";

}

/* ============================================================================
   SHARED RENDER PIECES
   ========================================================================== */
function synBadge(o) { return o.synthetic ? `<span class="badge b-syn" title="Synthetic demo record — not a real posting">SYNTHETIC</span>` : ""; }
function statusBadge(o) {
  const c = o.status === "Open" ? "b-open" : o.status === "Closing Soon" ? "b-soon" : "b-closed";
  return `<span class="badge ${c}">${esc(o.status || "Unknown")}</span>`;
}
function stipendText(o) {
  if (o.stipendMonthly == null) return "Not stated";
  const usd = toUSD(o.stipendMonthly, o.currency);
  return `${esc(o.currency)} ${num(o.stipendMonthly)}/mo` + (o.currency !== "USD" && usd != null ? ` <span class="muted small">≈ USD ${num(usd)}</span>` : "");
}
function deadlineText(o) {
  if (!o.deadline) return `<span class="muted">No deadline on file</span>`;
  const d = daysBetween(todayISO(), o.deadline);
  const col = d < 0 ? "var(--red)" : d <= 21 ? "var(--amber)" : "var(--tx-2)";
  return `<span style="color:${col}">${fmtDate(o.deadline)}${d >= 0 ? ` · ${d}d left` : " · closed"}</span>`;
}
function oppRow(o) {
  const st = stageOf(o.id);
  return `<div class="opp" data-opp="${o.id}">
    ${matchRing(o._match)}
    <div class="opp-main">
      <div class="opp-title">${esc(o.title)} ${synBadge(o)}</div>
      <div class="opp-sub">${esc(o.university)} · ${esc(o.city)}, ${esc(o.country)}${o.laboratory ? " · " + esc(o.laboratory) : ""}</div>
      <div class="opp-meta">
        ${statusBadge(o)}
        <span class="chip">${ic("i-money", "ic", 1.7)}${stipendText(o)}</span>
        <span class="chip">${ic("i-clock", "ic", 1.7)}${o.durationMonths ? o.durationMonths + " months" : "Duration TBD"}</span>
        ${o.visaSponsorship ? `<span class="chip">${ic("i-pass", "ic", 1.7)}Visa</span>` : ""}
        ${o.flightTicket ? `<span class="chip">${ic("i-plane", "ic", 1.7)}Flight</span>` : ""}
        ${o.qsRank ? `<span class="chip">QS ${o.qsRank}${o.rankSource === "SYNTHETIC" ? "*" : ""}</span>` : ""}
        ${st ? `<span class="badge b-acc">${STAGE_META[st].label}</span>` : ""}
        ${o.favourite ? `<span class="badge b-mut">★ Favourite</span>` : ""}
      </div>
    </div>
    <div class="opp-side">
      <div style="font-size:11.5px">${deadlineText(o)}</div>
      <div class="small muted">${esc(o.fundingType || "")}</div>
      <div style="display:flex;gap:5px">
        <button class="btn btn-xs" data-fav="${o.id}" title="Favourite">${o.favourite ? "★" : "☆"}</button>
        <button class="btn btn-xs" data-save="${o.id}">${st === "saved" ? "Saved" : "Save"}</button>
      </div>
    </div>
  </div>`;
}
function oppListHTML(list, emptyMsg) {
  if (!list.length) return `<div class="empty">${ic("i-search", "ic")}<h4>Nothing matches</h4><p>${esc(emptyMsg || "Adjust your filters or clear the search query.")}</p></div>`;
  return list.map(oppRow).join("");
}

/* ============================================================================
   FILTERING + SORTING
   ========================================================================== */
function applyFilters(list, f, q) {
  f = f || State.ui.filters;
  q = q == null ? State.ui.query : q;
  return list.filter(o => {
    if (f.hideSynthetic && o.synthetic) return false;
    if (f.syntheticOnly && !o.synthetic) return false;
    if (f.countries.length && !f.countries.includes(o.country)) return false;
    if (f.status.length && !f.status.includes(o.status)) return false;
    if (f.areas.length && !(o.researchKeywords || []).some(k => f.areas.includes(k))) return false;
    if (f.funding.length && !f.funding.includes(o.fundingType)) return false;
    if (f.agencies.length && !f.agencies.includes(o.fundingAgency)) return false;
    if (f.software.length && !(o.requiredSoftware || []).some(s => f.software.includes(s))) return false;
    if (f.langs.length && !(o.requiredLanguages || []).some(s => f.langs.includes(s))) return false;
    if (f.remote.length && !f.remote.includes(o.workMode)) return false;
    if (f.visa && !o.visaSponsorship) return false;
    if (f.flight && !o.flightTicket) return false;
    if (f.accommodation && !o.accommodation) return false;
    if (f.insurance && !o.medicalInsurance) return false;
    if (f.family && !o.familySupport) return false;
    if (f.minStipendUSD) { const u = toUSD(o.stipendMonthly, o.currency); if (u == null || u < f.minStipendUSD) return false; }
    if (f.maxRank) { const r = o.qsRank || o.theRank; if (r == null || r > f.maxRank) return false; }
    if (f.minMatch && o._match < f.minMatch) return false;
    if (f.minDuration && (o.durationMonths || 0) < f.minDuration) return false;
    if (f.deadlineWithin) {
      if (!o.deadline) return false;
      const d = daysBetween(todayISO(), o.deadline);
      if (d < 0 || d > f.deadlineWithin) return false;
    }
    if (!matchesQuery(o, q)) return false;
    return true;
  });
}
const SORTS = {
  match:    { label: "Best AI match",   fn: (a, b) => b._match - a._match },
  newest:   { label: "Newest",          fn: (a, b) => String(b.createdAt).localeCompare(String(a.createdAt)) },
  stipend:  { label: "Highest stipend", fn: (a, b) => (toUSD(b.stipendMonthly, b.currency) || 0) - (toUSD(a.stipendMonthly, a.currency) || 0) },
  deadline: { label: "Deadline soonest",fn: (a, b) => String(a.deadline || "9999").localeCompare(String(b.deadline || "9999")) },
  rank:     { label: "University rank", fn: (a, b) => (a.qsRank || a.theRank || 9999) - (b.qsRank || b.theRank || 9999) },
  country:  { label: "Country A–Z",     fn: (a, b) => String(a.country).localeCompare(String(b.country)) }
};
function sortList(list) { return list.slice().sort(SORTS[State.ui.sort] ? SORTS[State.ui.sort].fn : SORTS.match.fn); }
</script>
<script>

  const top = sortList(L.filter(o => o.status !== "Closed")).slice(0, 6);
  const recent = L.slice().sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt))).slice(0, 6);
  const closing = L.filter(o => o.status === "Closing Soon").sort((a, b) => String(a.deadline).localeCompare(String(b.deadline))).slice(0, 6);

  const geoRows = Object.entries(L.reduce((m, o) => {
    (m[o.country] = m[o.country] || []).push(o); return m;
  }, {})).map(([country, list]) => ({

    avgUSD: Math.round(avg(list.map(o => toUSD(o.stipendMonthly, o.currency)).filter(v => v != null))) || null
  }));

  ${window.PRIS_USING_FALLBACK ? `<div class="notice">${ic("i-warn")}<div>

    web address, the connection or the host may be down — reload in a minute. If you opened a local file, make sure
    <span class="mono">pris_data.js</span> is sitting in the same folder as this page.</div></div>` : ""}

  ${State.dataMeta ? (() => {
    const m = State.dataMeta, age = daysBetween(m.builtAt, todayISO());
    const liveN = L.filter(o => o.provenance).length;
    const stale = age >= 3;
    return `<div class="notice ${stale ? "" : "info"}">${ic(stale ? "i-warn" : "i-check")}<div>
      <b>${num(liveN)} verified records, fetched ${age === 0 ? "today" : age + " day" + (age === 1 ? "" : "s") + " ago"} (${esc(fmtDate(m.builtAt))})</b>
      from ${m.sources.filter(s => s.status === "OK").length} sources. Every one carries the URL it came from — open any
      record and use <b>Open the original posting</b> to check it.
      ${stale ? ` <b>This is getting old.</b> The scheduled refresh has not landed; deadlines may have passed.` : ""}
      ${m.sources.filter(s => s.status !== "OK").length ? ` ${m.sources.filter(s => s.status !== "OK").length} sources were
      not used — see <b>Data Sources</b> for which and why.` : ""}
    </div></div>`;
  })() : ""}

  ${synN ? `<div class="notice">${ic("i-warn")}<div><b>${num(synN)} of ${num(L.length)} records are synthetic demo data</b>

  ${(() => {
    const withStipend = L.filter(o => o.stipendMonthly != null).length;

    <div class="notice info">${ic("i-info")}<div><b>Coverage warning for the figures below.</b>

    ${kpi("Visa sponsored", num(L.filter(o => o.visaSponsorship).length), Math.round(L.filter(o => o.visaSponsorship).length / (L.length || 1) * 100) + "% of records", "i-pass")}
    ${kpi("Flight supported", num(L.filter(o => o.flightTicket).length), Math.round(L.filter(o => o.flightTicket).length / (L.length || 1) * 100) + "% of records", "i-plane")}
    ${kpi("Saved", num(cnt("saved")), "in your pipeline", "i-bookmark")}
